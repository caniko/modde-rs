          status="$(curl -sS -o pr.json -w '%{http_code}' -H "Authorization: Bearer ${FLATHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -d "$payload" https://api.github.com/repos/flathub/com.tartanoglu.modde/pulls)"
          if [ "$status" -eq 422 ]; then echo 'PR exists or rejected'; jq -r '.message' pr.json; exit 0; fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat pr.json; exit 1; fi
          jq -r '.html_url' pr.json
          SCRIPT
      - name: Publish winget manifest PR
        if: steps.republish.outputs.winget == 'true'
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping winget manifest update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${WINGET_PAT:-}" ]; then publisher_missing winget 'WINGET_PAT unset'; fi
          ZIP_NAME="modde-${VERSION}-x86_64-windows.zip"; ZIP_URL="https://github.com/caniko/modde-rs/releases/download/${TAG}/${ZIP_NAME}"
          test -s "release/${ZIP_NAME}" || publisher_missing winget "missing release/${ZIP_NAME}"
          export ZIP_NAME ZIP_URL VERSION WINGET_PAT PUBLISH_WINGET_STATE
          case "${PUBLISH_WINGET_STATE:-}" in active-required|inactive-soft) ;; *) echo "::error::winget: winget-pkgs probe was inconclusive (${PUBLISH_WINGET_STATE:-unset}); not guessing between a new version and a first submission." >&2; exit 1 ;; esac
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT' || publisher_missing winget 'GitHub API submission failed'
          set -euo pipefail
          tmpdir="$(mktemp -d)"; trap 'rm -rf "$tmpdir"' EXIT
          ID='Caniko.Modde'; MANIFEST_DIR='manifests/c/Caniko/Modde'; state="${PUBLISH_WINGET_STATE:-}"
          # yaml(): double-quoted YAML scalar; f KEY VALUE writes one field; hdr TYPE the schema header.
          yaml() { local s="${1//\\/\\\\}"; printf '"%s"' "${s//\"/\\\"}"; }
          f() { printf '%s: %s\n' "$1" "$(yaml "$2")"; }
          # shellcheck disable=SC2016
          hdr() { printf '# yaml-language-server: $schema=https://aka.ms/winget-manifest.%s.1.12.0.schema.json\n# Created with simit\n\n' "$1"; }
          dir="$tmpdir/"'manifests/c/Caniko/Modde'"/$VERSION"; mkdir -p "$dir"
          sha="$(sha256sum "release/${ZIP_NAME}" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          { hdr version; f PackageIdentifier 'Caniko.Modde'; f PackageVersion "$VERSION"; echo 'DefaultLocale: en-US'; echo 'ManifestType: version'; echo 'ManifestVersion: 1.12.0'; } > "$dir"/'Caniko.Modde'.yaml
          { hdr installer; f PackageIdentifier 'Caniko.Modde'; f PackageVersion "$VERSION"; echo 'InstallerType: zip'; echo 'NestedInstallerType: portable'; echo 'Installers:'; echo '- Architecture: x64'; echo '  NestedInstallerFiles:'; printf '%s\n' "  - RelativeFilePath: $(yaml 'modde.exe')" "    PortableCommandAlias: $(yaml 'modde')"; printf '%s\n' "  InstallerUrl: $(yaml "$ZIP_URL")" "  InstallerSha256: $sha"; echo 'ManifestType: installer'; echo 'ManifestVersion: 1.12.0'; } > "$dir"/'Caniko.Modde'.installer.yaml
          { hdr defaultLocale; f PackageIdentifier 'Caniko.Modde'; f PackageVersion "$VERSION"; echo 'PackageLocale: en-US'; f Publisher 'Caniko'; f PublisherUrl 'https://github.com/caniko'; f PackageName 'Modde'; f PackageUrl 'https://github.com/caniko/modde-rs'; f License 'GPL-3.0'; f ShortDescription 'CLI interface for modde'; echo 'ManifestType: defaultLocale'; echo 'ManifestVersion: 1.12.0'; } > "$dir"/'Caniko.Modde'.locale.en-US.yaml
          # Submit the manifests in "$dir" to microsoft/winget-pkgs through the GitHub
          # REST API as the WINGET_PAT user. Needs curl and jq.
          # Inputs: ID MANIFEST_DIR VERSION ZIP_URL WINGET_PAT, state (active-required when
          # the package already exists upstream) and dir (the generated manifest files).
          UP=microsoft/winget-pkgs
          umask 077
          # The token reaches curl through this 0600 header file, never through argv.
          printf 'Authorization: Bearer %s\n' "$WINGET_PAT" > "$tmpdir/auth"
          printf '{}' > "$tmpdir/empty.json"
          code=; last=
          # api METHOD PATH [BODYFILE]: body lands in $tmpdir/resp, status in $code, non-2xx returns 1.
          api() {
            local a=(-sS --retry 3 -o "$tmpdir/resp" -w '%{http_code}' -X "$1"
              -H "@$tmpdir/auth" -H 'Accept: application/vnd.github+json'
              -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json')
            [ -z "${3:-}" ] || a+=(--data-binary "@$3")
            last="$1 $2"
            code="$(curl "${a[@]}" "https://api.github.com$2")" || code=000
            case "$code" in 2??) ;; *) return 1 ;; esac
          }
          fail() { echo "::error::winget: $last -> HTTP $code: $(jq -r '.message // empty' "$tmpdir/resp" 2>/dev/null)" >&2; exit 1; }
          must() { api "$@" || fail; }
          val() { jq -r "$1" "$tmpdir/resp"; }

          # Nothing to do when this version is already upstream.
          api GET "/repos/$UP/contents/$MANIFEST_DIR/$VERSION" || true
          case "$code" in
            200) echo "winget: $ID $VERSION is already published in $UP"; exit 0 ;;
            404) ;;
            *) fail ;;
          esac
          # New package or new version: the package directory decides.
          if [ -z "$state" ]; then
            api GET "/repos/$UP/contents/$MANIFEST_DIR" || true
            case "$code" in 200) state=active-required ;; 404) state=inactive-soft ;; *) fail ;; esac
          fi
          if [ "$state" = active-required ]; then kind='New version'; else kind='New package'; fi
          title="$kind: $ID version $VERSION"

          must GET /user; login="$(val .login)"
          must GET "/repos/$UP"; base="$(val .default_branch)"
          branch="$(printf '%s-%s' "$ID" "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          # A PR that is still open is a success. When its head is this branch on the
          # token user's own fork, the regenerated manifests are moved onto it below.
          must GET "/repos/$UP/pulls?head=$login:$branch&state=open"
          pr="$(val '.[0].html_url // empty')"
          refresh=
          if [ -n "$pr" ]; then
            if jq -e --arg b "$branch" --arg f "${login,,}/winget-pkgs" \
              '.[0] | .head.ref == $b and ((.head.repo.full_name // "") | ascii_downcase) == $f' "$tmpdir/resp" > /dev/null; then
              refresh=1
            else
              echo "winget: PR already open: $pr"; exit 0
            fi
          fi

          # POST /forks is idempotent; the fork can take a while to appear.
          must POST "/repos/$UP/forks" "$tmpdir/empty.json"
          fork="/repos/$login/winget-pkgs"
          n=0
          until api GET "$fork"; do
            n=$((n + 1))
            [ "$n" -lt 24 ] || { echo "::error::winget: fork $login/winget-pkgs did not appear within 2 minutes" >&2; exit 1; }
            sleep 5
          done

          must GET "/repos/$UP/git/ref/heads/$base"; head="$(val .object.sha)"
          must GET "/repos/$UP/git/commits/$head"; base_tree="$(val .tree.sha)"
          # A lagging fork may not have the upstream commit yet; sync it first.
          api GET "$fork/git/commits/$head" || {
            jq -n --arg b "$base" '{branch: $b}' > "$tmpdir/b"
            must POST "$fork/merge-upstream" "$tmpdir/b"
          }

          # One commit holding the three manifests: blobs -> tree on the upstream tree -> commit -> ref.
          entries='[]'
          for f in "$dir"/*.yaml; do
            jq -n --rawfile c "$f" '{content: $c, encoding: "utf-8"}' > "$tmpdir/b"
            must POST "$fork/git/blobs" "$tmpdir/b"
            entries="$(jq -c --arg p "$MANIFEST_DIR/$VERSION/${f##*/}" --arg s "$(val .sha)" \
              '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<<"$entries")"
          done
          if [ -n "$refresh" ]; then
            # Identical blobs on the PR branch mean the PR already carries these manifests.
            want="$(jq -cS 'map({(.path | split("/") | last): .sha}) | add' <<<"$entries")"
            if api GET "$fork/contents/$MANIFEST_DIR/$VERSION?ref=$branch" \
              && [ "$(jq -cS 'map({(.name): .sha}) | add' "$tmpdir/resp")" = "$want" ]; then
              echo "winget: PR already open and up to date: $pr"; exit 0
            fi
          fi
          jq -n --arg b "$base_tree" --argjson e "$entries" '{base_tree: $b, tree: $e}' > "$tmpdir/b"
          must POST "$fork/git/trees" "$tmpdir/b"; tree="$(val .sha)"
          jq -n --arg m "$title" --arg t "$tree" --arg p "$head" '{message: $m, tree: $t, parents: [$p]}' > "$tmpdir/b"
          must POST "$fork/git/commits" "$tmpdir/b"; commit="$(val .sha)"
          if [ -n "$refresh" ]; then
            # Keep the PR: force-move its branch to the commit with the new manifests.
            jq -n --arg s "$commit" '{sha: $s, force: true}' > "$tmpdir/b"
            must PATCH "$fork/git/refs/heads/$branch" "$tmpdir/b"
            echo "winget: refreshed $pr with the regenerated manifests"; exit 0
          fi
          jq -n --arg r "refs/heads/$branch" --arg s "$commit" '{ref: $r, sha: $s}' > "$tmpdir/b"
          api POST "$fork/git/refs" "$tmpdir/b" || {
            [ "$code" != 422 ] && fail
            # The branch survives from an earlier run whose PR was closed: move it.
            jq -n --arg s "$commit" '{sha: $s, force: true}' > "$tmpdir/b"
            must PATCH "$fork/git/refs/heads/$branch" "$tmpdir/b"
          }

          jq -n --arg t "$title" --arg h "$login:$branch" --arg b "$base" \
            --arg body "Automated submission of $ID $VERSION from $ZIP_URL, generated by simit." \
            '{title: $t, head: $h, base: $b, body: $body, maintainer_can_modify: true}' > "$tmpdir/b"
          must POST "/repos/$UP/pulls" "$tmpdir/b"
          echo "winget: opened $(val .html_url)"
          SCRIPT
      - name: Publish Homebrew tap
        if: steps.republish.outputs.homebrew == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.homebrew_tap_token }}
          HOMEBREW_TAP_URL: https://codeberg.org/caniko/homebrew-modde.git
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Homebrew tap update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then publisher_missing homebrew 'HOMEBREW_TAP_TOKEN unset'; fi
          test -s "release/modde-${VERSION}-aarch64-darwin.tar.gz" || publisher_missing homebrew "missing release/modde-${VERSION}-aarch64-darwin.tar.gz"
          test -s "release/modde-${VERSION}-aarch64-linux.tar.gz" || publisher_missing homebrew "missing release/modde-${VERSION}-aarch64-linux.tar.gz"
          test -s "release/modde-${VERSION}-x86_64-linux.tar.gz" || publisher_missing homebrew "missing release/modde-${VERSION}-x86_64-linux.tar.gz"
          # Git expands the token when invoking this credential helper.
          # shellcheck disable=SC2016
          credential_helper='!f() { echo username=x-access-token; echo "password=$HOMEBREW_TAP_TOKEN"; }; f'
          rm -rf tap; git -c credential.helper="$credential_helper" clone "$HOMEBREW_TAP_URL" tap
          cd tap; git config credential.helper "$credential_helper"; git config user.email 'ci@localhost'; git config user.name 'release bot'
          git remote set-head origin -a; DEFAULT_BRANCH="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')"; git checkout "$DEFAULT_BRANCH"; cd ..
          nix run '.#harbor-rs' -- brew bump \
            --name modde \
            --version "$VERSION" \
            --description 'Cross-platform game mod manager' \
            --homepage 'https://modde.tartanoglu.com' \
            --license GPL-3.0-only \
            --archive "darwin_arm=https://github.com/caniko/modde-rs/releases/download/${TAG}/modde-${VERSION}-aarch64-darwin.tar.gz,release/modde-${VERSION}-aarch64-darwin.tar.gz" \
            --archive "linux_arm=https://github.com/caniko/modde-rs/releases/download/${TAG}/modde-${VERSION}-aarch64-linux.tar.gz,release/modde-${VERSION}-aarch64-linux.tar.gz" \
            --archive "linux_intel=https://github.com/caniko/modde-rs/releases/download/${TAG}/modde-${VERSION}-x86_64-linux.tar.gz,release/modde-${VERSION}-x86_64-linux.tar.gz" \
            --binary modde \
            --binary modde-ui \
            --tap "$PWD/tap"
          cd tap
          if [ -z "$(git status --porcelain -- Formula/modde.rb)" ]; then echo 'tap unchanged'; exit 0; fi
          git add Formula/modde.rb; git commit -m "modde ${VERSION}"; git push origin "HEAD:${DEFAULT_BRANCH}"
      - name: Publish Scoop bucket
        if: steps.republish.outputs.scoop == 'true'
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          SCOOP_BUCKET_URL: https://github.com/caniko/scoop-modde.git
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Scoop bucket update."; exit 0; fi
          if [ -z "${SCOOP_BUCKET_TOKEN:-}" ]; then echo 'SCOOP_BUCKET_TOKEN is required because Scoop bucket publishing is configured.' >&2; exit 1; fi
          test -s "release/modde-${VERSION}-x86_64-windows.zip"
          nix develop -c simit dist scoop bump --version "$VERSION" --bucket-url "$SCOOP_BUCKET_URL" --bucket-token-env SCOOP_BUCKET_TOKEN --work-dir scoop-bucket \
            --archive "x64=release/modde-${VERSION}-x86_64-windows.zip" \
            --push
      - name: Prepare Chocolatey package
        if: steps.republish.outputs.chocolatey == 'true'
        id: chocolatey-source
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Chocolatey package preparation."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          ZIP="release/modde-${VERSION}-x86_64-windows.zip"; test -s "$ZIP" || publisher_missing chocolatey "missing $ZIP"
          nix develop -c nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'modde' \
            --choco-id 'modde' \
            --choco-title 'modde' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Cross-platform game mod manager' \
            --choco-project-url 'https://modde.tartanoglu.com' \
            --choco-license-url 'https://raw.githubusercontent.com/caniko/modde-rs/trunk/LICENSE' \
            --choco-download-repo 'caniko/modde-rs' \
            --choco-archive-pattern 'modde-{version}-{arch}-windows.zip' \
            --api-key-env CHOCOLATEY_API_KEY
          printf 'prepared=true\n' >> "$GITHUB_OUTPUT"
      - name: Restore exact Chocolatey candidate
        if: steps.republish.outputs.chocolatey == 'true' && (steps.chocolatey-source.outputs.prepared == 'true')
        id: chocolatey-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: chocolatey-package/.simit-candidates
          key: chocolatey-${{ github.repository }}-refs/tags/${{ inputs.tag }}-${{ steps.validate.outputs.sha }}-${{ hashFiles('chocolatey-package/*.nuspec', 'chocolatey-package/tools/*.ps1') }}
      - name: Pack Chocolatey candidate without publication credentials
        if: steps.republish.outputs.chocolatey == 'true' && (steps.chocolatey-source.outputs.prepared == 'true')
        run: |
          set -euo pipefail
          . ./release-env
          ZIP="release/modde-${VERSION}-x86_64-windows.zip"
          nix develop -c nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'modde' \
            --choco-id 'modde' \
            --choco-title 'modde' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Cross-platform game mod manager' \
            --choco-project-url 'https://modde.tartanoglu.com' \
            --choco-license-url 'https://raw.githubusercontent.com/caniko/modde-rs/trunk/LICENSE' \
            --choco-download-repo 'caniko/modde-rs' \
            --choco-archive-pattern 'modde-{version}-{arch}-windows.zip' \
            --pack --api-key-env CHOCOLATEY_API_KEY
      - name: Persist Chocolatey candidate before publication
        if: steps.republish.outputs.chocolatey == 'true' && (steps.chocolatey-source.outputs.prepared == 'true' && steps.chocolatey-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: chocolatey-package/.simit-candidates
          key: chocolatey-${{ github.repository }}-refs/tags/${{ inputs.tag }}-${{ steps.validate.outputs.sha }}-${{ hashFiles('chocolatey-package/*.nuspec', 'chocolatey-package/tools/*.ps1') }}
      - name: Require persisted Chocolatey candidate
        id: chocolatey-persisted
        if: steps.republish.outputs.chocolatey == 'true' && (steps.chocolatey-source.outputs.prepared == 'true')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: chocolatey-package/.simit-candidates
          key: chocolatey-${{ github.repository }}-refs/tags/${{ inputs.tag }}-${{ steps.validate.outputs.sha }}-${{ hashFiles('chocolatey-package/*.nuspec', 'chocolatey-package/tools/*.ps1') }}
          fail-on-cache-miss: true
      - name: Publish Chocolatey package
        if: steps.republish.outputs.chocolatey == 'true'
        env:
          CHOCO_CANDIDATE_CACHE_HIT: ${{ steps.chocolatey-persisted.outputs.cache-hit }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          CHOCO_PUSH_SOURCE: https://push.chocolatey.org/
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Chocolatey package update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${CHOCOLATEY_API_KEY:-}" ]; then publisher_missing chocolatey 'CHOCOLATEY_API_KEY unset'; fi
          ZIP="release/modde-${VERSION}-x86_64-windows.zip"; test -s "$ZIP" || publisher_missing chocolatey "missing $ZIP"
          if [ "${CHOCO_CANDIDATE_CACHE_HIT:-}" != true ]; then echo 'Chocolatey candidate persistence was not verified.' >&2; exit 1; fi
          nix develop -c nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'modde' \
            --choco-id 'modde' \
            --choco-title 'modde' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Cross-platform game mod manager' \
            --choco-project-url 'https://modde.tartanoglu.com' \
            --choco-license-url 'https://raw.githubusercontent.com/caniko/modde-rs/trunk/LICENSE' \
            --choco-download-repo 'caniko/modde-rs' \
            --choco-archive-pattern 'modde-{version}-{arch}-windows.zip' \
            --push \
            --push-source "$CHOCO_PUSH_SOURCE" \
            --api-key-env CHOCOLATEY_API_KEY
