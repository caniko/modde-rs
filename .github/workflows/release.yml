---
# yamllint disable rule:line-length
# Generated by simit. Manual edits will be reported as ci=drift.
# Required secrets and variables:
# - GITHUB_TOKEN: hosted release API token for release creation and asset upload.
# - MINISIGN_SECRET_KEY, MINISIGN_PASSWORD: minisign signing of SHA256SUMS.txt.
# - COSIGN_PRIVATE_KEY, COSIGN_PASSWORD: optional fallback when keyless Sigstore OIDC is unavailable.
# - MODDE_APT_REPO_GPG_KEY: armored GPG private key for the apt repository.
# - vars.MODDE_APT_REPO_GPG_KEY_ID: fingerprint for the apt repository signing key.
# - MODDE_APT_REPO_GPG_PASSPHRASE: optional passphrase for the apt signing key.
# - MODDE_APT_REPO_SSH_KEY: ed25519 deploy key that pushes the apt tree.
# - AUR_SSH_KEY: Ed25519 private key for aur.archlinux.org pushes.
# - COPR_LOGIN, COPR_USERNAME, COPR_TOKEN: COPR upload credentials; COPR_USERNAME is an Actions variable.
# - CODEBERG_TOKEN: optional Scoop bucket push token.
# - WINDOWS_SIGNING_PFX, WINDOWS_SIGNING_PASS: optional Authenticode PKCS#12 cert + passphrase.
# - CHOCOLATEY_API_KEY: optional Chocolatey push API key (env CHOCOLATEY_API_KEY).
# - FLATHUB_TOKEN: optional GitHub PAT for flathub/com.tartanoglu.modde Flathub PRs.
# - WINGET_PAT: optional GitHub PAT for winget-pkgs PRs.
# - MASTODON_TOKEN, MASTODON_BASE_URL, MATRIX_TOKEN, MATRIX_HOMESERVER, MATRIX_ROOM: required when release announcements are configured.
# - ATTIC_TOKEN: repository secret for native prebuild Attic publication.

name: release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish channels for (leave empty for a plain dispatch)
        required: false
        type: string
      channels:
        description: "Comma-separated channels to republish with tag, e.g. winget,chocolatey"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow_ref }}-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    permissions:
      contents: read
    timeout-minutes: 360
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${FORGEJO_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${FORGEJO_REF:-}}}"; VERSION="${ref#refs/tags/}"; fi
          TAG="$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          git_fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_worktree="$(mktemp -d)"
          rmdir "$tag_worktree"
          cleanup_validation() {
            if [ -n "${tag_worktree:-}" ]; then git worktree remove --force "$tag_worktree" >/dev/null 2>&1 || rm -rf "$tag_worktree"; fi
            if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup_validation EXIT
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"
          git verify-tag "$TAG"
          signed_tag_name="$(git cat-file tag "refs/tags/$TAG" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$TAG" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          event_sha="${GITHUB_SHA:-${FORGE_SHA:-${FORGEJO_SHA:-}}}"
          test -n "$event_sha" && test "$validated_sha" = "$event_sha" && test "$checkout_sha" = "$event_sha" || { echo "Signed tag commit does not match the immutable event checkout" >&2; exit 1; }
          git worktree add --detach "$tag_worktree" "$validated_sha"
          test "$(nix eval --raw "$tag_worktree#modde.version")" = "$VERSION"
          if ! grep -q "^## \[$VERSION\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]" "$tag_worktree/CHANGELOG.md"; then
            echo "CHANGELOG.md missing section for $VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s\n' "$VERSION" | grep -Eq -- '-(rc|beta|alpha)\.[0-9]+$'; then IS_PRERELEASE=true; fi

          git checkout --detach "$validated_sha"
          { printf 'TAG=%s\n' "$TAG"; printf 'VERSION=%s\n' "$VERSION"; printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"; } > release-env
      - name: Required gate generated-workflows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/sccache && sudo chmod 1777 /var/cache/sccache && printf '%s\n' 'extra-sandbox-paths = /var/cache/sccache' 'max-jobs = 1' 'cores = 2' | sudo tee -a /etc/nix/nix.conf && nix develop --no-update-lock-file --max-jobs 1 --cores 2 -c simit init ci --platform github --ci-provider actions --runtime nix --workspace --workspace-strategy aggregate --runner ubuntu-latest --publish-crates=false --with-artifacts=false --check --diff && nix develop --no-update-lock-file --max-jobs 1 --cores 2 -c simit init release --platform github --ci-provider actions --check --diff
      - name: Required gate crate-compatibility
        timeout-minutes: 90
        run: |
          set -euo pipefail
          bash .github/scripts/check-crate-compatibility.sh
      - name: Required gate library-qualification
        timeout-minutes: 60
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-containment.sh && sudo mkdir -p /var/cache/sccache && sudo chmod 1777 /var/cache/sccache && printf '%s\n' 'extra-sandbox-paths = /var/cache/sccache' 'max-jobs = 1' 'cores = 2' | sudo tee -a /etc/nix/nix.conf && nix develop --no-update-lock-file --max-jobs 1 --cores 2 -c cargo xtask library-qualify --containment --jobs 4
      - name: Required gate library-package-lifecycle
        timeout-minutes: 90
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-containment.sh && sudo mkdir -p /var/cache/sccache && sudo chmod 1777 /var/cache/sccache && printf '%s\n' 'extra-sandbox-paths = /var/cache/sccache' 'max-jobs = 1' 'cores = 2' | sudo tee -a /etc/nix/nix.conf && nix build --no-update-lock-file --max-jobs 1 --cores 2 .#modde --out-link result-qualified-package && nix develop --no-update-lock-file --max-jobs 1 --cores 2 -c cargo xtask library-package-qualify --binary "$(readlink -f result-qualified-package)/bin/modde" --output "$RUNNER_TEMP/modde-package-receipt"
  prebuild:
    needs: validate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    uses: ./.github/workflows/prebuild.yaml
    with:
      release: true
    secrets:
      attic_token: ${{ secrets.ATTIC_TOKEN }}
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    needs: [validate, prebuild]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${FORGEJO_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${FORGEJO_REF:-}}}"; VERSION="${ref#refs/tags/}"; fi
          TAG="$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          git_fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_worktree="$(mktemp -d)"
          rmdir "$tag_worktree"
          cleanup_validation() {
            if [ -n "${tag_worktree:-}" ]; then git worktree remove --force "$tag_worktree" >/dev/null 2>&1 || rm -rf "$tag_worktree"; fi
            if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup_validation EXIT
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"
          git verify-tag "$TAG"
          signed_tag_name="$(git cat-file tag "refs/tags/$TAG" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$TAG" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          event_sha="${GITHUB_SHA:-${FORGE_SHA:-${FORGEJO_SHA:-}}}"
          test -n "$event_sha" && test "$validated_sha" = "$event_sha" && test "$checkout_sha" = "$event_sha" || { echo "Signed tag commit does not match the immutable event checkout" >&2; exit 1; }
          git worktree add --detach "$tag_worktree" "$validated_sha"
          test "$(nix eval --raw "$tag_worktree#modde.version")" = "$VERSION"
          if ! grep -q "^## \[$VERSION\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]" "$tag_worktree/CHANGELOG.md"; then
            echo "CHANGELOG.md missing section for $VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s\n' "$VERSION" | grep -Eq -- '-(rc|beta|alpha)\.[0-9]+$'; then IS_PRERELEASE=true; fi

          git checkout --detach "$validated_sha"
          { printf 'TAG=%s\n' "$TAG"; printf 'VERSION=%s\n' "$VERSION"; printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"; } > release-env
      - name: Generate release notes
        run: |
          set -euo pipefail
          . ./release-env
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$" { found = 1; print; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
      - name: Check release credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MODDE_APT_REPO_GPG_KEY: ${{ secrets.MODDE_APT_REPO_GPG_KEY }}
          MODDE_APT_REPO_GPG_KEY_ID: ${{ vars.MODDE_APT_REPO_GPG_KEY_ID }}
          MODDE_APT_REPO_GPG_FINGERPRINT: ${{ vars.MODDE_APT_REPO_GPG_FINGERPRINT }}
          MODDE_APT_REPO_GPG_PUBLIC_KEY: ${{ vars.MODDE_APT_REPO_GPG_PUBLIC_KEY }}
          MODDE_APT_REPO_SSH_KEY: ${{ secrets.MODDE_APT_REPO_SSH_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          . ./release-env
          missing=''
          require_credential() {
            scope="$1"; name="$2"; value="$3"
            if [ -z "$value" ]; then missing="$(printf '%s\n  - %s %s' "$missing" "$scope" "$name")"; fi
          }
          require_credential 'global/user secret' 'GITHUB_TOKEN' "${GITHUB_TOKEN:-}"
          require_credential 'repo secret' 'MINISIGN_SECRET_KEY' "${MINISIGN_SECRET_KEY:-}"
          require_credential 'repo secret' 'MINISIGN_PASSWORD' "${MINISIGN_PASSWORD:-}"
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo secret' 'MODDE_APT_REPO_GPG_KEY' "${MODDE_APT_REPO_GPG_KEY:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo variable' 'MODDE_APT_REPO_GPG_KEY_ID' "${MODDE_APT_REPO_GPG_KEY_ID:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo variable' 'MODDE_APT_REPO_GPG_FINGERPRINT' "${MODDE_APT_REPO_GPG_FINGERPRINT:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo variable' 'MODDE_APT_REPO_GPG_PUBLIC_KEY' "${MODDE_APT_REPO_GPG_PUBLIC_KEY:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo secret' 'MODDE_APT_REPO_SSH_KEY' "${MODDE_APT_REPO_SSH_KEY:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'global/user secret' 'CODEBERG_TOKEN' "${CODEBERG_TOKEN:-}"
          fi
          require_credential 'repo secret' 'ATTIC_TOKEN' "${ATTIC_TOKEN:-}"
          if [ -n "$missing" ]; then
            printf 'Missing release credentials:%s\n' "$missing" >&2
            exit 1
          fi
          test -s keys/minisign.pub
          umask 077
          minisign_key="$(mktemp)"; minisign_probe="$(mktemp)"; minisign_sig="${minisign_probe}.minisig"
          trap 'rm -f "$minisign_key" "$minisign_probe" "$minisign_sig"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf 'simit release credentials probe\n' > "$minisign_probe"
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix shell nixpkgs#minisign -c minisign -S -s "$minisign_key" -m "$minisign_probe" -x "$minisign_sig"
          nix shell nixpkgs#minisign -c minisign -V -m "$minisign_probe" -x "$minisign_sig" -p keys/minisign.pub
      - name: Rewrite dist/rpm/modde.spec Version
        run: |
          . ./release-env
          sed -i "0,/^Version:.*$/s//Version:        ${VERSION}/" dist/rpm/modde.spec
          grep '^Version:' dist/rpm/modde.spec
      - name: Check supply-chain policy
        run: |
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#cargo-deny -c cargo deny check -W unmaintained advisories bans sources licenses
      - name: Build SRPM for COPR
        run: |
          set -euo pipefail
          . ./release-env
          export SOURCE_ARCHIVE="modde-rs-v${VERSION}.tar.gz"
          export SRPM_DIR='target/modde-release/root-artifacts/srpms'
          git archive --format=tar.gz --prefix=modde-rs/ -o "$SOURCE_ARCHIVE" HEAD
          nix shell nixpkgs#rpm nixpkgs#cargo nixpkgs#rustc -c bash <<'SCRIPT'
          set -euo pipefail
          tar xf "$SOURCE_ARCHIVE"
          ( cd modde-rs && cargo vendor vendor > ../cargo-vendor-config.toml )
          tar czf vendor.tar.gz -C modde-rs vendor
          mkdir -p -- "$SRPM_DIR"
          rm -f -- "$SRPM_DIR"/*.src.rpm
          rpmbuild -bs dist/rpm/modde.spec --define "_sourcedir $(pwd)" --define "_srcrpmdir $(pwd)/$SRPM_DIR"
          shopt -s nullglob
          srpms=("$SRPM_DIR"/*.src.rpm); test "${#srpms[@]}" -eq 1; test -s "${srpms[0]}"; ls -l "${srpms[0]}"
          SCRIPT
      - name: Generate supply-chain reports
        run: |
          set -euo pipefail
          . ./release-env
          export VERSION IS_PRERELEASE
          mkdir -p release
          nix develop -c bash <<'SBOM'
          set -euo pipefail
          mkdir -p target/modde-release/root-artifacts/release
          cargo about generate --config dist/licenses/about.toml --output-file target/modde-release/root-artifacts/release/THIRD_PARTY_LICENSES.html dist/licenses/about-template.hbs
          cargo sbom --output-format cyclone_dx_json_1_5 > "target/modde-release/root-artifacts/release/modde-${VERSION}.cdx.json"
          cargo sbom --output-format spdx_json_2_3 > "target/modde-release/root-artifacts/release/modde-${VERSION}.spdx.json"
          SBOM

      - name: Build release artifacts
        run: |
          set -euo pipefail
          . ./release-env
          export TAG VERSION IS_PRERELEASE
          mkdir -p release
          df -h /
          free_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          test "$free_kib" -ge 8388608 || { echo "GitHub runner has less than 8 GiB free before Nix realization" >&2; exit 1; }
          mkdir -p target
          echo 'disk before bundle release-bundle'
          df -h /
          nix build '.#release-bundle' --out-link 'target/simit-release-bundle-0'
          test -d 'target/simit-release-bundle-0'
          while IFS= read -r file; do
            name="$(basename "$file")"
            test ! -e "release/$name" || { echo "release bundle asset collision: $name" >&2; exit 1; }
            cp -L "$file" "release/$name"
          done < <(find -L 'target/simit-release-bundle-0' -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort)
          echo 'disk after bundle release-bundle'
          df -h /
          shopt -s nullglob
          manifests=(release/*-release-manifest.json)
          test "${#manifests[@]}" -eq 1 || { echo "expected exactly one release manifest from Nix bundles" >&2; exit 1; }
          jq -e --arg version "$VERSION" '(.schemaVersion == 2) and (.version == $version) and (.artifacts | length > 0)' "${manifests[0]}" >/dev/null
          copy_nix_binary() {
            result_dir="$1"; binary="$2"; destination="$3"
            if [ -f "${result_dir}/bin/.${binary}-wrapped" ]; then cp "${result_dir}/bin/.${binary}-wrapped" "$destination"; else cp "${result_dir}/bin/${binary}" "$destination"; fi
          }

          nix build .#modde --out-link target/modde-release/root-artifacts/linux-result
          mkdir -p target/modde-release/root-artifacts/release/linux-x86_64
          copy_nix_binary target/modde-release/root-artifacts/linux-result modde target/modde-release/root-artifacts/release/linux-x86_64/modde
          copy_nix_binary target/modde-release/root-artifacts/linux-result modde-ui target/modde-release/root-artifacts/release/linux-x86_64/modde-ui
          cp target/modde-release/root-artifacts/release/linux-x86_64/modde "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64-linux"
          cp target/modde-release/root-artifacts/release/linux-x86_64/modde-ui "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-x86_64-linux"

          nix build .#modde-aarch64-linux --out-link target/modde-release/root-artifacts/aarch64-linux-result
          mkdir -p target/modde-release/root-artifacts/release/linux-aarch64
          copy_nix_binary target/modde-release/root-artifacts/aarch64-linux-result modde target/modde-release/root-artifacts/release/linux-aarch64/modde
          copy_nix_binary target/modde-release/root-artifacts/aarch64-linux-result modde-ui target/modde-release/root-artifacts/release/linux-aarch64/modde-ui
          cp target/modde-release/root-artifacts/release/linux-aarch64/modde "target/modde-release/root-artifacts/release/modde-${VERSION}-aarch64-linux"
          cp target/modde-release/root-artifacts/release/linux-aarch64/modde-ui "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-aarch64-linux"

          nix build .#modde-windows --out-link target/modde-release/root-artifacts/windows-result
          mkdir -p target/modde-release/root-artifacts/release/windows-x86_64
          cp target/modde-release/root-artifacts/windows-result/bin/modde.exe target/modde-release/root-artifacts/windows-result/bin/modde-ui.exe target/modde-release/root-artifacts/release/windows-x86_64/
          if [ -f target/modde-release/root-artifacts/windows-result/bin/libmcfgthread-2.dll ]; then cp target/modde-release/root-artifacts/windows-result/bin/libmcfgthread-2.dll target/modde-release/root-artifacts/release/windows-x86_64/; fi
          # Windows tar.gz/zip and individual signed .exe assets are produced
          # by the Authenticode signing step, after the .exe files are signed.

          nix build .#modde-darwin-aarch64 --out-link target/modde-release/root-artifacts/darwin-arm-result
          mkdir -p target/modde-release/root-artifacts/release/darwin-aarch64
          cp target/modde-release/root-artifacts/darwin-arm-result/bin/modde target/modde-release/root-artifacts/darwin-arm-result/bin/modde-ui target/modde-release/root-artifacts/release/darwin-aarch64/
          tar czf "target/modde-release/root-artifacts/release/modde-${VERSION}-aarch64-darwin.tar.gz" -C target/modde-release/root-artifacts/release/darwin-aarch64 modde modde-ui

          nix build .#appimage-ui --out-link target/modde-release/root-artifacts/appimage-ui-result
          cp target/modde-release/root-artifacts/appimage-ui-result "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-x86_64.AppImage"
          nix build .#appimage-cli --out-link target/modde-release/root-artifacts/appimage-cli-result
          cp target/modde-release/root-artifacts/appimage-cli-result "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64.AppImage"

          git archive --format=tar.gz --prefix=modde-rs/ -o "target/modde-release/root-artifacts/release/modde-rs-${VERSION}.tar.gz" HEAD
          source_sha256="$(sha256sum "target/modde-release/root-artifacts/release/modde-rs-${VERSION}.tar.gz" | awk '{print $1}')"
          nix build .#flatpak-manifest --out-link target/modde-release/root-artifacts/flatpak-result
          cp target/modde-release/root-artifacts/flatpak-result target/modde-release/root-artifacts/release/com.tartanoglu.modde.json
          sed -i "s/@SOURCE_TARBALL_SHA256@/${source_sha256}/" target/modde-release/root-artifacts/release/com.tartanoglu.modde.json
          nix run .#flatpak-cargo-generator -- Cargo.lock -o target/modde-release/root-artifacts/release/cargo-sources.json
          cp target/modde-release/root-artifacts/srpms/*.src.rpm target/modde-release/root-artifacts/release/ 2>/dev/null || true
          mkdir -p release
          cp -a target/modde-release/root-artifacts/release/. release/

          rm -f target/simit-release-bundle-*
          nix store gc
          df -h /
          free_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          test "$free_kib" -ge 2097152 || { echo "GitHub runner has less than 2 GiB free before release publication" >&2; exit 1; }
      - name: Build Debian packages
        run: |
          set -euo pipefail
          . ./release-env
          export VERSION IS_PRERELEASE
          mkdir -p release
          nix develop -c simit dist apt build --version "$VERSION" --release-dir release
      - name: Sign Windows Authenticode artifacts
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
          WINDOWS_SIGNING_SUBJECT: ${{ secrets.WINDOWS_SIGNING_SUBJECT }}
        run: |
          set -euo pipefail
          . ./release-env
          for exe in release/windows-x86_64/modde.exe release/windows-x86_64/modde-ui.exe; do test -s "$exe"; done
          if [ -n "${WINDOWS_SIGNING_PFX:-}" ] && [ -n "${WINDOWS_SIGNING_PASS:-}" ]; then
            nix shell nixpkgs#osslsigncode nixpkgs#openssl -c bash <<'SCRIPT'
          set -euo pipefail
          umask 077
          pfx_file="$(mktemp)"; pass_file="$(mktemp)"
          trap 'rm -f "$pfx_file" "$pass_file"' EXIT
          printf '%s' "$WINDOWS_SIGNING_PFX" | base64 --decode > "$pfx_file"
          printf '%s' "$WINDOWS_SIGNING_PASS" > "$pass_file"
          for exe in release/windows-x86_64/modde.exe release/windows-x86_64/modde-ui.exe; do
            osslsigncode sign -pkcs12 "$pfx_file" -readpass "$pass_file" -h sha256 \
              -n 'modde' -i 'https://modde.tartanoglu.com' -ts 'http://timestamp.digicert.com' \
              -in "$exe" -out "${exe}.signed"
            osslsigncode verify -in "${exe}.signed"
            mv "${exe}.signed" "$exe"
          done
          SCRIPT
          else
            echo '::warning::WINDOWS_SIGNING_PFX/PASS unset; publishing unsigned Windows EXEs.'
          fi
          tar czf "release/modde-${VERSION}-x86_64-windows.tar.gz" -C release/windows-x86_64 modde.exe modde-ui.exe
          zip_out="$PWD/release/modde-${VERSION}-x86_64-windows.zip"
          # Expand positional arguments inside the child shell.
          # shellcheck disable=SC2016
          nix shell nixpkgs#zip -c bash -c 'cd "$1" && zip_out="$2" && shift 2 && zip -q "$zip_out" "$@"' _ release/windows-x86_64 "$zip_out" modde.exe modde-ui.exe
          cp release/windows-x86_64/modde.exe "release/modde-${VERSION}-x86_64-windows.exe"
          cp release/windows-x86_64/modde-ui.exe "release/modde-ui-${VERSION}-x86_64-windows.exe"
      - name: Generate release checksums
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=()
          add_matches() { local pattern="$1" match; while IFS= read -r match; do files+=("$match"); done < <(compgen -G "$pattern" || true); }
          add_matches '*.tar.gz'
          add_matches '*.zip'
          add_matches '*.AppImage'
          add_matches '*.deb'
          add_matches '*.src.rpm'
          add_matches '*.cdx.json'
          add_matches '*.spdx.json'
          : > SHA256SUMS.txt
          count=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            [ "$file" != SHA256SUMS.txt ] || continue
            sha256sum "$file" >> SHA256SUMS.txt
            count=$((count + 1))
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          test "$count" -gt 0
          test -s SHA256SUMS.txt
      - name: Sign checksums and attest release artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          . ./release-env
          test -s keys/minisign.pub
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PASSWORD:-}"
          umask 077
          minisign_key="$(mktemp)"; oidc_token="$(mktemp)"; cosign_key="$(mktemp)"; export oidc_token cosign_key
          trap 'rm -f "$minisign_key" "$oidc_token" "$cosign_key"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix shell nixpkgs#minisign -c minisign -S -s "$minisign_key" -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig
          nix shell nixpkgs#minisign -c minisign -V -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig -p keys/minisign.pub

          nix shell nixpkgs#cosign nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          repo_url="https://github.com/caniko/modde-rs"
          git_sha="$(git rev-parse HEAD)"
          workflow_sha="$(sha256sum .github/workflows/release.yml | awk '{print $1}')"
          flake_lock_sha="missing"; if [ -f flake.lock ]; then flake_lock_sha="$(sha256sum flake.lock | awk '{print $1}')"; fi
          builder_id="${repo_url}/blob/${TAG}/.github/workflows/release.yml"
          sign_blob_keyless() { file="$1"; if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -er '.value' > "$oidc_token"; cosign sign-blob --yes --identity-token "$(cat "$oidc_token")" --bundle "${file}.cosign.bundle" "$file"; else return 1; fi; }
          attest_blob_keyless() { file="$1"; predicate="$2"; if [ -s "$oidc_token" ]; then cosign attest-blob --yes --identity-token "$(cat "$oidc_token")" --predicate "$predicate" --type slsaprovenance1 --bundle "${file}.intoto.bundle" "$file"; else return 1; fi; }
          sign_blob_with_key() { file="$1"; test -n "${COSIGN_PRIVATE_KEY:-}"; printf '%s' "$COSIGN_PRIVATE_KEY" > "$cosign_key"; cosign sign-blob --yes --key "$cosign_key" --bundle "${file}.cosign.bundle" "$file"; }
          attest_blob_with_key() { file="$1"; predicate="$2"; cosign attest-blob --yes --key "$cosign_key" --predicate "$predicate" --type slsaprovenance1 --bundle "${file}.intoto.bundle" "$file"; }
          shopt -s nullglob
          files=(release/*.tar.gz release/*.zip release/*.AppImage release/*.deb release/*.src.rpm release/*.exe)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            artifact_sha="$(sha256sum "$file" | awk '{print $1}')"; predicate="$(mktemp)"
            jq -n --arg builder_id "$builder_id" --arg git_sha "$git_sha" --arg workflow_sha "$workflow_sha" --arg flake_lock_sha "$flake_lock_sha" --arg repo_url "$repo_url" --arg ref "refs/tags/${TAG}" --arg artifact "$(basename "$file")" --arg artifact_sha "$artifact_sha" '{buildDefinition:{buildType:"https://simit.rs/release",externalParameters:{repository:$repo_url,ref:$ref,artifact:$artifact,artifactDigest:{sha256:$artifact_sha}},internalParameters:{},resolvedDependencies:[{uri:($repo_url+".git"),digest:{gitCommit:$git_sha}},{uri:"flake.lock",digest:{sha256:$flake_lock_sha}},{uri:"release workflow",digest:{sha256:$workflow_sha}}]},runDetails:{builder:{id:$builder_id}}}' > "$predicate"
            if sign_blob_keyless "$file" && attest_blob_keyless "$file" "$predicate"; then echo "signed+attested $file (keyless)"; elif [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then echo "keyless failed for $file; using COSIGN_PRIVATE_KEY"; sign_blob_with_key "$file"; attest_blob_with_key "$file" "$predicate"; else echo "::error::keyless Sigstore failed and COSIGN_PRIVATE_KEY is unset for $file" >&2; exit 1; fi
            test -s "${file}.cosign.bundle"
            test -s "${file}.intoto.bundle"
            rm -f "$predicate"
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          SCRIPT
      - name: Run release smoke checks
        run: |
          set -euo pipefail
          . ./release-env
          mkdir -p release
          nix run .#release-smoke -- "$VERSION" release
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API: https://api.github.com
          GITHUB_REPO: caniko/modde-rs
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          . ./release-env
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          release_payload=$(jq -n --arg tag "$TAG" --arg name "$TAG" --arg branch "trunk" --argjson prerelease "$IS_PRERELEASE" --rawfile body release-notes.md '{tag_name: $tag, target_commitish: $branch, name: $name, body: $body, draft: false, prerelease: $prerelease}')
          status=$(curl -sS -o release.json -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -d "$release_payload" "$GITHUB_API/repos/$GITHUB_REPO/releases")
          if [ "$status" = "409" ] || [ "$status" = "422" ]; then
            curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/tags/$TAG" > release.json
          elif [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat release.json; exit 1; fi
          release_id=$(jq -r '.id' release.json); test "$release_id" != "null"
          upload_url=$(jq -r '.upload_url' release.json | cut -d '{' -f 1); test -n "$upload_url"
          shopt -s nullglob
          files=()
          add_matches() { local pattern="$1" match; while IFS= read -r match; do files+=("$match"); done < <(compgen -G "$pattern" || true); }
          add_matches 'release/SHA256SUMS.txt'
          add_matches 'release/SHA256SUMS.txt.minisig'
          add_matches 'release/*.cosign.bundle'
          add_matches 'release/*.intoto.bundle'
          add_matches 'release/*.tar.gz'
          add_matches 'release/*.zip'
          add_matches 'release/*.AppImage'
          add_matches 'release/*.deb'
          add_matches 'release/*.src.rpm'
          add_matches 'release/*.cdx.json'
          add_matches 'release/*.spdx.json'
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            asset_id=$(curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/$release_id/assets" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -n 1)
            if [ -n "$asset_id" ]; then curl -sS --fail -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/assets/$asset_id"; fi
            curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/octet-stream' --data-binary "@$file" "$upload_url?name=$name" > /dev/null
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          SCRIPT
      - name: Probe downstream publisher state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . ./release-env
          : > release-publisher-state.env
          gh_auth=(); if [ -n "${GITHUB_TOKEN:-}" ]; then gh_auth=(-H "Authorization: Bearer $GITHUB_TOKEN"); fi
          write_state() {
            channel="$1"; state="$2"; detail="$3"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            printf '%s=%s\n' "$var" "$state" >> release-publisher-state.env
            printf '%-10s %s %s\n' "$channel" "$state" "$detail"
          }
          public_git_url() {
            case "$1" in
              ssh://git@codeberg.org/*) path="${1#ssh://git@codeberg.org/}"; printf 'https://codeberg.org/%s\n' "$path" ;;
              git@codeberg.org:*) path="${1#git@codeberg.org:}"; printf 'https://codeberg.org/%s\n' "$path" ;;
              ssh://git@codefloe.com/*) path="${1#ssh://git@codefloe.com/}"; printf 'https://codefloe.com/%s\n' "$path" ;;
              git@codefloe.com:*) path="${1#git@codefloe.com:}"; printf 'https://codefloe.com/%s\n' "$path" ;;
              ssh://git@github.com/*) path="${1#ssh://git@github.com/}"; printf 'https://github.com/%s\n' "$path" ;;
              git@github.com:*) path="${1#git@github.com:}"; printf 'https://github.com/%s\n' "$path" ;;
              *) printf '%s\n' "$1" ;;
            esac
          }
          probe_git_file() {
            repo="$1"; ref="$2"; path="$3"
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            git clone --depth 1 --branch "$ref" "$(public_git_url "$repo")" "$tmp/repo" >/dev/null 2>&1 && test -e "$tmp/repo/$path"
          }
          probe_git_tree() {
            repo="$1"; ref="$2"; path_a="$3"; path_b="$4"; tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            git clone --depth 1 --branch "$ref" "$(public_git_url "$repo")" "$tmp/repo" >/dev/null 2>&1 && test -e "$tmp/repo/$path_a" && test -e "$tmp/repo/$path_b"
          }
          active_or_soft() {
            channel="$1"; detail="$2"; shift 2
            if "$@"; then write_state "$channel" active-required "$detail"; else write_state "$channel" inactive-soft "$detail"; fi
          }
          stable_or_state() {
            channel="$1"; detail="$2"; shift 2
            if [ "$IS_PRERELEASE" = "true" ]; then write_state "$channel" skipped-prerelease "$detail"; else active_or_soft "$channel" "$detail" "$@"; fi
          }
          stable_or_state apt 'ssh://git@github.com/caniko/apt-modde.git pages' probe_git_tree 'ssh://git@github.com/caniko/apt-modde.git' 'pages' dists pool
          stable_or_state aur 'modde' bash -c 'git ls-remote --exit-code '\''https://aur.archlinux.org/modde.git'\'' HEAD >/dev/null 2>&1 && git ls-remote --exit-code '\''https://aur.archlinux.org/modde-bin.git'\'' HEAD >/dev/null 2>&1 && git ls-remote --exit-code '\''https://aur.archlinux.org/modde-git.git'\'' HEAD >/dev/null 2>&1'
          COPR_PROBE_PROJECT='caniko/modde-rs'
          if [ "$IS_PRERELEASE" = "true" ]; then COPR_PROBE_PROJECT='caniko/modde-rs-testing'; fi
          active_or_soft copr "$COPR_PROBE_PROJECT" curl -fsSL "https://copr.fedorainfracloud.org/coprs/${COPR_PROBE_PROJECT}/"
          CHOCO_FILTER="$(printf '%s' 'Id eq '\''modde'\'' and IsLatestVersion' | jq -sRr @uri)"
          export CHOCO_FILTER
          # Expand the filter in the child shell.
          # shellcheck disable=SC2016
          stable_or_state chocolatey 'modde' bash -c 'curl -fsSL "https://community.chocolatey.org/api/v2/Packages()?%24filter=${CHOCO_FILTER}" | grep -q "<entry>"'
          stable_or_state homebrew 'https://codeberg.org/caniko/homebrew-modde.git' probe_git_file 'https://codeberg.org/caniko/homebrew-modde.git' HEAD 'Formula/modde.rb'
          stable_or_state scoop 'https://github.com/caniko/scoop-modde.git' probe_git_file 'https://github.com/caniko/scoop-modde.git' HEAD 'bucket/modde.json'
          stable_or_state flathub 'flathub/com.tartanoglu.modde' curl -fsSL "${gh_auth[@]}" 'https://api.github.com/repos/flathub/com.tartanoglu.modde'
          winget_code="$(curl -sS -o /dev/null -w '%{http_code}' "${gh_auth[@]}" 'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/c/Caniko/Modde' || true)"
          case "$winget_code" in 200) winget_state=active-required ;; 404) winget_state=inactive-soft ;; *) winget_state=probe-failed ;; esac
          if [ "$IS_PRERELEASE" = "true" ]; then winget_state=skipped-prerelease; fi
          write_state winget "$winget_state" 'Caniko.Modde'
      - name: Publish APT repository
        env:
          APT_REPO_GPG_KEY: ${{ secrets.MODDE_APT_REPO_GPG_KEY }}
          APT_REPO_GPG_KEY_ID: ${{ vars.MODDE_APT_REPO_GPG_KEY_ID }}
          APT_REPO_GPG_PASSPHRASE: ${{ secrets.MODDE_APT_REPO_GPG_PASSPHRASE }}
          APT_REPO_SSH_KEY: ${{ secrets.MODDE_APT_REPO_SSH_KEY }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping APT repository publish."; exit 0; fi
          if [ -z "${APT_REPO_GPG_KEY:-}" ] || [ -z "${APT_REPO_GPG_KEY_ID:-}" ] || [ -z "${APT_REPO_SSH_KEY:-}" ]; then echo '::error::apt secrets are required because APT repository publishing is configured.' >&2; exit 1; fi
          debs=(release/*.deb); if [ ! -e "${debs[0]}" ]; then echo '::error::release .deb artifacts are required because APT repository publishing is configured.' >&2; exit 1; fi
          nix develop -c simit dist apt publish --version "$VERSION" --release-dir release --push
      - name: Announce stable release
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ROOM: ${{ secrets.MATRIX_ROOM }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping announcements."; exit 0; fi
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          release_url="$(jq -r '.html_url // .url // empty' release.json 2>/dev/null || true)"
          if [ -z "$release_url" ]; then release_url="https://github.com/caniko/modde-rs/releases/tag/${TAG}"; fi
          body="release ${VERSION} is out: ${release_url}"
          if [ -n "${MASTODON_TOKEN:-}" ] && [ -n "${MASTODON_BASE_URL:-}" ]; then
            jq -n --arg status "$body" '{status: $status}' > mastodon-status.json
            curl -sS --fail -H "Authorization: Bearer ${MASTODON_TOKEN}" -H 'Content-Type: application/json' -d @mastodon-status.json "${MASTODON_BASE_URL%/}/api/v1/statuses" > /dev/null
          else echo 'Mastodon secrets are required because release announcements are configured.' >&2; exit 1; fi
          if [ -n "${MATRIX_TOKEN:-}" ] && [ -n "${MATRIX_HOMESERVER:-}" ] && [ -n "${MATRIX_ROOM:-}" ]; then
            txnid="release-${VERSION}-${CODEBERG_RUN_ID:-manual}"
            encoded_room="$(jq -rn --arg v "$MATRIX_ROOM" '$v|@uri')"
            jq -n --arg body "$body" '{msgtype: "m.text", body: $body}' > matrix-message.json
            curl -sS --fail -X PUT -H "Authorization: Bearer ${MATRIX_TOKEN}" -H 'Content-Type: application/json' -d @matrix-message.json "${MATRIX_HOMESERVER%/}/_matrix/client/r0/rooms/${encoded_room}/send/m.room.message/${txnid}" > /dev/null
          else echo 'Matrix secrets are required because release announcements are configured.' >&2; exit 1; fi
          SCRIPT
      - name: Publish AUR packages
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping AUR packages."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${AUR_SSH_KEY:-}" ]; then publisher_missing aur 'AUR_SSH_KEY unset'; fi
          nix shell nixpkgs#git nixpkgs#openssh nixpkgs#pacman nixpkgs#util-linux -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          AUR_HOST='aur.archlinux.org'; AUR_SSH="$HOME/.ssh/aur"
          MAKEPKG_CONF="$(dirname "$(dirname "$(command -v makepkg)")")/etc/makepkg.conf"; test -r "$MAKEPKG_CONF"
          print_srcinfo() (
            set -euo pipefail
            pkgdir="$1"
            owner=''
            trap 'status=$?; rm -f "$pkgdir/.SRCINFO.tmp"; if [ -n "$owner" ]; then chown -R "$owner" "$pkgdir" || exit 1; fi; exit "$status"' EXIT
            if [ "$(id -u)" -eq 0 ]; then
              owner="$(stat -c '%u:%g' "$pkgdir")"
              chown -R 65534:65534 "$pkgdir"
              (cd "$pkgdir" && setpriv --reuid=65534 --regid=65534 --clear-groups makepkg --config "$MAKEPKG_CONF" --printsrcinfo) > "$pkgdir/.SRCINFO.tmp"
            else
              (cd "$pkgdir" && makepkg --config "$MAKEPKG_CONF" --printsrcinfo) > "$pkgdir/.SRCINFO.tmp"
            fi
            test -s "$pkgdir/.SRCINFO.tmp"
            mv "$pkgdir/.SRCINFO.tmp" "$pkgdir/.SRCINFO"
          )
          checksum_for() { awk -v a="$1" '$2 == a { print $1 }' release/SHA256SUMS.txt; }
          source_sha="$(checksum_for "modde-rs-${VERSION}.tar.gz")"
          bin_sha="$(checksum_for "modde-${VERSION}-x86_64-linux.tar.gz")"; test -n "$bin_sha"
          test -n "$source_sha"
          install -d -m 700 "$HOME/.ssh"; printf '%s\n' "$AUR_SSH_KEY" > "$AUR_SSH"; chmod 600 "$AUR_SSH"
          ssh-keyscan "$AUR_HOST" >> "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $AUR_SSH -o IdentitiesOnly=yes"
          publish_pkg() {
            pkg="$1"
            repo="ssh://aur@aur.archlinux.org/${pkg}.git"
            rm -rf "aur-${pkg}"
            if ! git clone "$repo" "aur-${pkg}"; then mkdir "aur-${pkg}"; git -C "aur-${pkg}" init; git -C "aur-${pkg}" remote add origin "$repo"; fi
            git -C "aur-${pkg}" checkout -B master
            cp "dist/aur/${pkg}/PKGBUILD" "aur-${pkg}/PKGBUILD"
            case "$pkg" in
              modde)
                sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e 's/^pkgrel=.*/pkgrel=1/' "aur-${pkg}/PKGBUILD"
                awk -v sha="$source_sha" '/^sha256sums=/{print "sha256sums=(\047" sha "\047)"; next} {print}' "aur-${pkg}/PKGBUILD" > "aur-${pkg}/PKGBUILD.new"; mv "aur-${pkg}/PKGBUILD.new" "aur-${pkg}/PKGBUILD" ;;
              modde-bin)
                sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e 's/^pkgrel=.*/pkgrel=1/' "aur-${pkg}/PKGBUILD"
                awk -v b="$bin_sha" -v s="$source_sha" '/^sha256sums=/{print "sha256sums=(\047" b "\047"; print "            \047" s "\047)"; skip=1; next} skip && /^[[:space:]]*\047/{next} {skip=0; print}' "aur-${pkg}/PKGBUILD" > "aur-${pkg}/PKGBUILD.new"; mv "aur-${pkg}/PKGBUILD.new" "aur-${pkg}/PKGBUILD" ;;
              modde-git) ;;
              *) echo "unknown AUR package: $pkg" >&2; exit 1 ;;
            esac
            print_srcinfo "aur-${pkg}"
            git -C "aur-${pkg}" add PKGBUILD .SRCINFO
            if git -C "aur-${pkg}" diff --cached --quiet; then echo "AUR ${pkg} already at ${VERSION}"; return 0; fi
            git -C "aur-${pkg}" -c user.email='ci@localhost' -c user.name='release bot' commit -m "${VERSION}"
            git -C "aur-${pkg}" push origin HEAD:master
          }
          for pkg in modde modde-bin modde-git; do publish_pkg "$pkg"; done
          SCRIPT
      - name: Publish Flathub update PR
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Flathub update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${FLATHUB_TOKEN:-}" ]; then publisher_missing flathub 'FLATHUB_TOKEN unset'; fi
          test -s "release/com.tartanoglu.modde.json" || publisher_missing flathub "missing release/com.tartanoglu.modde.json"
          test -s "release/cargo-sources.json" || publisher_missing flathub "missing release/cargo-sources.json"
          nix shell nixpkgs#curl nixpkgs#git nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          credential_helper='!f() { echo username=x-access-token; echo "password=$FLATHUB_TOKEN"; }; f'
          rm -rf flathub-repo; git -c credential.helper="$credential_helper" clone https://github.com/flathub/com.tartanoglu.modde.git flathub-repo
          cd flathub-repo
          git config credential.helper "$credential_helper"; git config user.email 'ci@localhost'; git config user.name 'release bot'
          git checkout -B "release/${VERSION}"
          cp ../release/com.tartanoglu.modde.json ../release/cargo-sources.json .
          if [ -z "$(git status --porcelain -- com.tartanoglu.modde.json cargo-sources.json)" ]; then echo 'manifest unchanged'; exit 0; fi
          git add com.tartanoglu.modde.json cargo-sources.json; git commit -m "${VERSION}"; git push --force-with-lease origin "release/${VERSION}"
          payload="$(jq -n --arg title "${VERSION}" --arg head "release/${VERSION}" --arg base "master" --arg body "Update to ${VERSION}." '{title: $title, head: $head, base: $base, body: $body}')"
          status="$(curl -sS -o pr.json -w '%{http_code}' -H "Authorization: Bearer ${FLATHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -d "$payload" https://api.github.com/repos/flathub/com.tartanoglu.modde/pulls)"
          if [ "$status" -eq 422 ]; then echo 'PR exists or rejected'; jq -r '.message' pr.json; exit 0; fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat pr.json; exit 1; fi
          jq -r '.html_url' pr.json
          SCRIPT
      - name: Publish winget manifest PR
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping winget manifest update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${WINGET_PAT:-}" ]; then publisher_missing winget 'WINGET_PAT unset'; fi
          ZIP_NAME="modde-${VERSION}-x86_64-windows.zip"; ZIP_URL="https://github.com/caniko/modde-rs/releases/download/${TAG}/${ZIP_NAME}"
          test -s "release/${ZIP_NAME}" || publisher_missing winget "missing release/${ZIP_NAME}"
          export ZIP_NAME ZIP_URL VERSION WINGET_PAT PUBLISH_WINGET_STATE
          case "${PUBLISH_WINGET_STATE:-}" in active-required|inactive-soft) ;; *) echo "::error::winget: winget-pkgs probe was inconclusive (${PUBLISH_WINGET_STATE:-unset}); not guessing between a new version and a first submission." >&2; exit 1 ;; esac
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT' || publisher_missing winget 'GitHub API submission failed'
          set -euo pipefail
          tmpdir="$(mktemp -d)"; trap 'rm -rf "$tmpdir"' EXIT
          ID='Caniko.Modde'; MANIFEST_DIR='manifests/c/Caniko/Modde'; state="${PUBLISH_WINGET_STATE:-}"
          # yaml(): double-quoted YAML scalar; f KEY VALUE writes one field; hdr TYPE the schema header.
          yaml() { local s="${1//\\/\\\\}"; printf '"%s"' "${s//\"/\\\"}"; }
          f() { printf '%s: %s\n' "$1" "$(yaml "$2")"; }
          # shellcheck disable=SC2016
          hdr() { printf '# yaml-language-server: $schema=https://aka.ms/winget-manifest.%s.1.12.0.schema.json\n# Created with simit\n\n' "$1"; }
          dir="$tmpdir/"'manifests/c/Caniko/Modde'"/$VERSION"; mkdir -p "$dir"
          sha="$(sha256sum "release/${ZIP_NAME}" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          { hdr version; f PackageIdentifier 'Caniko.Modde'; f PackageVersion "$VERSION"; echo 'DefaultLocale: en-US'; echo 'ManifestType: version'; echo 'ManifestVersion: 1.12.0'; } > "$dir"/'Caniko.Modde'.yaml
          { hdr installer; f PackageIdentifier 'Caniko.Modde'; f PackageVersion "$VERSION"; echo 'InstallerType: zip'; echo 'NestedInstallerType: portable'; echo 'Installers:'; echo '- Architecture: x64'; echo '  NestedInstallerFiles:'; printf '%s\n' "  - RelativeFilePath: $(yaml 'modde.exe')" "    PortableCommandAlias: $(yaml 'modde')"; printf '%s\n' "  InstallerUrl: $(yaml "$ZIP_URL")" "  InstallerSha256: $sha"; echo 'ManifestType: installer'; echo 'ManifestVersion: 1.12.0'; } > "$dir"/'Caniko.Modde'.installer.yaml
          { hdr defaultLocale; f PackageIdentifier 'Caniko.Modde'; f PackageVersion "$VERSION"; echo 'PackageLocale: en-US'; f Publisher 'Caniko'; f PublisherUrl 'https://github.com/caniko'; f PackageName 'Modde'; f PackageUrl 'https://github.com/caniko/modde-rs'; f License 'GPL-3.0'; f ShortDescription 'CLI interface for modde'; echo 'ManifestType: defaultLocale'; echo 'ManifestVersion: 1.12.0'; } > "$dir"/'Caniko.Modde'.locale.en-US.yaml
          # Submit the manifests in "$dir" to microsoft/winget-pkgs through the GitHub
          # REST API as the WINGET_PAT user. Needs curl and jq.
          # Inputs: ID MANIFEST_DIR VERSION ZIP_URL WINGET_PAT, state (active-required when
          # the package already exists upstream) and dir (the generated manifest files).
          UP=microsoft/winget-pkgs
          umask 077
          # The token reaches curl through this 0600 header file, never through argv.
          printf 'Authorization: Bearer %s\n' "$WINGET_PAT" > "$tmpdir/auth"
          printf '{}' > "$tmpdir/empty.json"
          code=; last=
          # api METHOD PATH [BODYFILE]: body lands in $tmpdir/resp, status in $code, non-2xx returns 1.
          api() {
            local a=(-sS --retry 3 -o "$tmpdir/resp" -w '%{http_code}' -X "$1"
              -H "@$tmpdir/auth" -H 'Accept: application/vnd.github+json'
              -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json')
            [ -z "${3:-}" ] || a+=(--data-binary "@$3")
            last="$1 $2"
            code="$(curl "${a[@]}" "https://api.github.com$2")" || code=000
            case "$code" in 2??) ;; *) return 1 ;; esac
          }
          fail() { echo "::error::winget: $last -> HTTP $code: $(jq -r '.message // empty' "$tmpdir/resp" 2>/dev/null)" >&2; exit 1; }
          must() { api "$@" || fail; }
          val() { jq -r "$1" "$tmpdir/resp"; }

          # Nothing to do when this version is already upstream.
          api GET "/repos/$UP/contents/$MANIFEST_DIR/$VERSION" || true
          case "$code" in
            200) echo "winget: $ID $VERSION is already published in $UP"; exit 0 ;;
            404) ;;
            *) fail ;;
          esac
          # New package or new version: the package directory decides.
          if [ -z "$state" ]; then
            api GET "/repos/$UP/contents/$MANIFEST_DIR" || true
            case "$code" in 200) state=active-required ;; 404) state=inactive-soft ;; *) fail ;; esac
          fi
          if [ "$state" = active-required ]; then kind='New version'; else kind='New package'; fi
          title="$kind: $ID version $VERSION"

          must GET /user; login="$(val .login)"
          must GET "/repos/$UP"; base="$(val .default_branch)"
          branch="$(printf '%s-%s' "$ID" "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          # A PR that is still open is a success. When its head is this branch on the
          # token user's own fork, the regenerated manifests are moved onto it below.
          must GET "/repos/$UP/pulls?head=$login:$branch&state=open"
          pr="$(val '.[0].html_url // empty')"
          refresh=
          if [ -n "$pr" ]; then
            if jq -e --arg b "$branch" --arg f "${login,,}/winget-pkgs" \
              '.[0] | .head.ref == $b and ((.head.repo.full_name // "") | ascii_downcase) == $f' "$tmpdir/resp" > /dev/null; then
              refresh=1
            else
              echo "winget: PR already open: $pr"; exit 0
            fi
          fi

          # POST /forks is idempotent; the fork can take a while to appear.
          must POST "/repos/$UP/forks" "$tmpdir/empty.json"
          fork="/repos/$login/winget-pkgs"
          n=0
          until api GET "$fork"; do
            n=$((n + 1))
            [ "$n" -lt 24 ] || { echo "::error::winget: fork $login/winget-pkgs did not appear within 2 minutes" >&2; exit 1; }
            sleep 5
          done

          must GET "/repos/$UP/git/ref/heads/$base"; head="$(val .object.sha)"
          must GET "/repos/$UP/git/commits/$head"; base_tree="$(val .tree.sha)"
          # A lagging fork may not have the upstream commit yet; sync it first.
          api GET "$fork/git/commits/$head" || {
            jq -n --arg b "$base" '{branch: $b}' > "$tmpdir/b"
            must POST "$fork/merge-upstream" "$tmpdir/b"
          }

          # One commit holding the three manifests: blobs -> tree on the upstream tree -> commit -> ref.
          entries='[]'
          for f in "$dir"/*.yaml; do
            jq -n --rawfile c "$f" '{content: $c, encoding: "utf-8"}' > "$tmpdir/b"
            must POST "$fork/git/blobs" "$tmpdir/b"
            entries="$(jq -c --arg p "$MANIFEST_DIR/$VERSION/${f##*/}" --arg s "$(val .sha)" \
              '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<<"$entries")"
          done
          if [ -n "$refresh" ]; then
            # Identical blobs on the PR branch mean the PR already carries these manifests.
            want="$(jq -cS 'map({(.path | split("/") | last): .sha}) | add' <<<"$entries")"
            if api GET "$fork/contents/$MANIFEST_DIR/$VERSION?ref=$branch" \
              && [ "$(jq -cS 'map({(.name): .sha}) | add' "$tmpdir/resp")" = "$want" ]; then
              echo "winget: PR already open and up to date: $pr"; exit 0
            fi
          fi
          jq -n --arg b "$base_tree" --argjson e "$entries" '{base_tree: $b, tree: $e}' > "$tmpdir/b"
          must POST "$fork/git/trees" "$tmpdir/b"; tree="$(val .sha)"
          jq -n --arg m "$title" --arg t "$tree" --arg p "$head" '{message: $m, tree: $t, parents: [$p]}' > "$tmpdir/b"
          must POST "$fork/git/commits" "$tmpdir/b"; commit="$(val .sha)"
          if [ -n "$refresh" ]; then
            # Keep the PR: force-move its branch to the commit with the new manifests.
            jq -n --arg s "$commit" '{sha: $s, force: true}' > "$tmpdir/b"
            must PATCH "$fork/git/refs/heads/$branch" "$tmpdir/b"
            echo "winget: refreshed $pr with the regenerated manifests"; exit 0
          fi
          jq -n --arg r "refs/heads/$branch" --arg s "$commit" '{ref: $r, sha: $s}' > "$tmpdir/b"
          api POST "$fork/git/refs" "$tmpdir/b" || {
            [ "$code" != 422 ] && fail
            # The branch survives from an earlier run whose PR was closed: move it.
            jq -n --arg s "$commit" '{sha: $s, force: true}' > "$tmpdir/b"
            must PATCH "$fork/git/refs/heads/$branch" "$tmpdir/b"
          }

          jq -n --arg t "$title" --arg h "$login:$branch" --arg b "$base" \
            --arg body "Automated submission of $ID $VERSION from $ZIP_URL, generated by simit." \
            '{title: $t, head: $h, base: $b, body: $body, maintainer_can_modify: true}' > "$tmpdir/b"
          must POST "/repos/$UP/pulls" "$tmpdir/b"
          echo "winget: opened $(val .html_url)"
          SCRIPT
      - name: Publish Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.homebrew_tap_token }}
          HOMEBREW_TAP_URL: https://codeberg.org/caniko/homebrew-modde.git
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Homebrew tap update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then publisher_missing homebrew 'HOMEBREW_TAP_TOKEN unset'; fi
          test -s "release/modde-${VERSION}-aarch64-darwin.tar.gz" || publisher_missing homebrew "missing release/modde-${VERSION}-aarch64-darwin.tar.gz"
          test -s "release/modde-${VERSION}-aarch64-linux.tar.gz" || publisher_missing homebrew "missing release/modde-${VERSION}-aarch64-linux.tar.gz"
          test -s "release/modde-${VERSION}-x86_64-linux.tar.gz" || publisher_missing homebrew "missing release/modde-${VERSION}-x86_64-linux.tar.gz"
          # Git expands the token when invoking this credential helper.
          # shellcheck disable=SC2016
          credential_helper='!f() { echo username=x-access-token; echo "password=$HOMEBREW_TAP_TOKEN"; }; f'
          rm -rf tap; git -c credential.helper="$credential_helper" clone "$HOMEBREW_TAP_URL" tap
          cd tap; git config credential.helper "$credential_helper"; git config user.email 'ci@localhost'; git config user.name 'release bot'
          git remote set-head origin -a; DEFAULT_BRANCH="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')"; git checkout "$DEFAULT_BRANCH"; cd ..
          nix run '.#harbor-rs' -- brew bump \
            --name modde \
            --version "$VERSION" \
            --description 'Cross-platform game mod manager' \
            --homepage 'https://modde.tartanoglu.com' \
            --license GPL-3.0-only \
            --archive "darwin_arm=https://github.com/caniko/modde-rs/releases/download/${TAG}/modde-${VERSION}-aarch64-darwin.tar.gz,release/modde-${VERSION}-aarch64-darwin.tar.gz" \
            --archive "linux_arm=https://github.com/caniko/modde-rs/releases/download/${TAG}/modde-${VERSION}-aarch64-linux.tar.gz,release/modde-${VERSION}-aarch64-linux.tar.gz" \
            --archive "linux_intel=https://github.com/caniko/modde-rs/releases/download/${TAG}/modde-${VERSION}-x86_64-linux.tar.gz,release/modde-${VERSION}-x86_64-linux.tar.gz" \
            --binary modde \
            --binary modde-ui \
            --tap "$PWD/tap"
          cd tap
          if [ -z "$(git status --porcelain -- Formula/modde.rb)" ]; then echo 'tap unchanged'; exit 0; fi
          git add Formula/modde.rb; git commit -m "modde ${VERSION}"; git push origin "HEAD:${DEFAULT_BRANCH}"
      - name: Publish Scoop bucket
