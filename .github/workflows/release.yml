            --name modde \
            --version "$VERSION" \
            --description 'Cross-platform game mod manager' \
            --homepage 'https://modde.tartanoglu.com' \
            --license GPL-3.0-only \
            --archive "darwin_arm=https://github.com/caniko/modde-rs/releases/download/${VERSION}/modde-${VERSION}-aarch64-darwin.tar.gz,release/modde-${VERSION}-aarch64-darwin.tar.gz" \
            --archive "linux_arm=https://github.com/caniko/modde-rs/releases/download/${VERSION}/modde-${VERSION}-aarch64-linux.tar.gz,release/modde-${VERSION}-aarch64-linux.tar.gz" \
            --archive "linux_intel=https://github.com/caniko/modde-rs/releases/download/${VERSION}/modde-${VERSION}-x86_64-linux.tar.gz,release/modde-${VERSION}-x86_64-linux.tar.gz" \
            --binary modde \
            --binary modde-ui \
            --tap "$PWD/tap"
          cd tap
          if [ -z "$(git status --porcelain -- Formula/modde.rb)" ]; then echo 'tap unchanged'; exit 0; fi
          git add Formula/modde.rb; git commit -m "modde ${VERSION}"; git push origin "HEAD:${DEFAULT_BRANCH}"
      - name: Publish Scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          SCOOP_BUCKET_URL: https://github.com/caniko/scoop-modde.git
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Scoop bucket update."; exit 0; fi
          if [ -z "${SCOOP_BUCKET_TOKEN:-}" ]; then echo 'SCOOP_BUCKET_TOKEN is required because Scoop bucket publishing is configured.' >&2; exit 1; fi
          test -s "release/modde-${VERSION}-x86_64-windows.zip"
          nix develop -c simit dist scoop bump --version "$VERSION" --bucket-url "$SCOOP_BUCKET_URL" --bucket-token-env SCOOP_BUCKET_TOKEN --work-dir scoop-bucket \
            --archive "x64=release/modde-${VERSION}-x86_64-windows.zip" \
            --push
      - name: Push SRPM to COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ vars.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          . ./release-env
          COPR_PROJECT="caniko/modde-rs"
          if [ "$IS_PRERELEASE" = "true" ]; then COPR_PROJECT="caniko/modde-rs-testing"; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            if [ "$state" = active-required ]; then echo "::error::${channel}: ${message}" >&2; exit 1; fi
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "$COPR_LOGIN" ] || [ -z "$COPR_USERNAME" ] || [ -z "$COPR_TOKEN" ]; then publisher_missing copr 'COPR credentials unset'; fi
          srpms=(target/modde-release/root-artifacts/srpms/*.src.rpm); if [ ! -e "${srpms[0]}" ]; then publisher_missing copr 'no SRPM to publish'; fi
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          chmod 600 ~/.config/copr
          nix run .#copr-cli -- build --nowait "${COPR_PROJECT}" target/modde-release/root-artifacts/srpms/*.src.rpm
      - name: Publish Chocolatey package
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          CHOCO_PUSH_SOURCE: https://push.chocolatey.org/
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Chocolatey package update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            if [ "$state" = active-required ]; then echo "::error::${channel}: ${message}" >&2; exit 1; fi
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${CHOCOLATEY_API_KEY:-}" ]; then publisher_missing chocolatey 'CHOCOLATEY_API_KEY unset'; fi
          ZIP="release/modde-${VERSION}-x86_64-windows.zip"; test -s "$ZIP" || publisher_missing chocolatey "missing $ZIP"
          CHOCO_VERSION_FILTER="Id%20eq%20'modde'%20and%20Version%20eq%20'${VERSION}'"
          if curl -fsSL "https://community.chocolatey.org/api/v2/Packages()?%24filter=${CHOCO_VERSION_FILTER}" | grep -q "<entry>"; then echo "Chocolatey ${VERSION} already published; skipping."; exit 0; fi
          choco_log="$(mktemp)"; trap 'rm -f "$choco_log"' EXIT
          if ! nix develop -c nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'modde' \
            --choco-id 'modde' \
            --choco-title 'modde' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Cross-platform game mod manager' \
            --choco-project-url 'https://modde.tartanoglu.com' \
            --choco-license-url 'https://raw.githubusercontent.com/caniko/modde-rs/trunk/LICENSE' \
            --choco-download-repo 'caniko/modde-rs' \
            --choco-archive-pattern 'modde-{version}-{arch}-windows.zip' \
            --push \
            --push-source "$CHOCO_PUSH_SOURCE" \
            --api-key-env CHOCOLATEY_API_KEY 2>&1 | tee "$choco_log"; then
            if grep -q 'Chocolatey rejects duplicate version pushes' "$choco_log"; then
              echo 'Chocolatey version already published; skipping duplicate push.'
              exit 0
            fi
            exit 1
          fi
