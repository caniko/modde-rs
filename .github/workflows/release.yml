---
# yamllint disable rule:line-length
# Generated by simit. Manual edits will be reported as ci=drift.
# Required secrets and variables:
# - GITHUB_TOKEN: hosted release API token for release creation and asset upload.
# - MINISIGN_SECRET_KEY, MINISIGN_PASSWORD: minisign signing of SHA256SUMS.txt.
# - COSIGN_PRIVATE_KEY, COSIGN_PASSWORD: optional fallback when keyless Sigstore OIDC is unavailable.
# - MODDE_APT_REPO_GPG_KEY: armored GPG private key for the apt repository.
# - vars.MODDE_APT_REPO_GPG_KEY_ID: fingerprint for the apt repository signing key.
# - MODDE_APT_REPO_GPG_PASSPHRASE: optional passphrase for the apt signing key.
# - MODDE_APT_REPO_SSH_KEY: ed25519 deploy key that pushes the apt tree.
# - AUR_SSH_KEY: Ed25519 private key for aur.archlinux.org pushes.
# - COPR_LOGIN, COPR_USERNAME, COPR_TOKEN: COPR upload credentials; COPR_USERNAME is an Actions variable.
# - CODEBERG_TOKEN: optional Scoop bucket push token.
# - WINDOWS_SIGNING_PFX, WINDOWS_SIGNING_PASS: optional Authenticode PKCS#12 cert + passphrase.
# - CHOCOLATEY_API_KEY: optional Chocolatey push API key (env CHOCOLATEY_API_KEY).
# - FLATHUB_TOKEN: optional GitHub PAT for flathub/com.tartanoglu.modde Flathub PRs.
# - WINGET_PAT: optional GitHub PAT for winget-pkgs PRs.
# - MASTODON_TOKEN, MASTODON_BASE_URL, MATRIX_TOKEN, MATRIX_HOMESERVER, MATRIX_ROOM: required when release announcements are configured.
# Runner credential: $ATTIC_TOKENS_DIR/modde-rs: Attic token file.

name: release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${FORGEJO_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${FORGEJO_REF:-}}}"; VERSION="${ref#refs/tags/}"; fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'
          git fetch --force --tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          tag_worktree="$(mktemp -d)"
          rmdir "$tag_worktree"
          cleanup_validation() {
            if [ -n "${tag_worktree:-}" ]; then git worktree remove --force "$tag_worktree" >/dev/null 2>&1 || rm -rf "$tag_worktree"; fi
            if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup_validation EXIT
          git worktree add --detach "$tag_worktree" "$VERSION"
          test "$(nix eval --raw "$tag_worktree#modde.version")" = "$VERSION"
          test -s "$tag_worktree/keys/maintainers.gpg"
          if ! grep -q "^## \[$VERSION\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]" "$tag_worktree/CHANGELOG.md"; then
            echo "CHANGELOG.md missing section for $VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s\n' "$VERSION" | grep -Eq -- '-(rc|beta|alpha)\.[0-9]+$'; then IS_PRERELEASE=true; fi

          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          gpg --batch --import "$tag_worktree/keys/maintainers.gpg"
          git verify-tag "$VERSION"
          validated_sha="$(git -C "$tag_worktree" rev-parse HEAD)"
          git checkout --detach "$validated_sha"
          { printf 'VERSION=%s\n' "$VERSION"; printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"; } > release-env
      - name: Check release credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MODDE_APT_REPO_GPG_KEY: ${{ secrets.MODDE_APT_REPO_GPG_KEY }}
          MODDE_APT_REPO_GPG_KEY_ID: ${{ vars.MODDE_APT_REPO_GPG_KEY_ID }}
          MODDE_APT_REPO_GPG_FINGERPRINT: ${{ vars.MODDE_APT_REPO_GPG_FINGERPRINT }}
          MODDE_APT_REPO_GPG_PUBLIC_KEY: ${{ vars.MODDE_APT_REPO_GPG_PUBLIC_KEY }}
          MODDE_APT_REPO_SSH_KEY: ${{ secrets.MODDE_APT_REPO_SSH_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          . ./release-env
          missing=''
          require_credential() {
            scope="$1"; name="$2"; value="$3"
            if [ -z "$value" ]; then missing="$(printf '%s\n  - %s %s' "$missing" "$scope" "$name")"; fi
          }
          require_credential 'global/user secret' 'GITHUB_TOKEN' "${GITHUB_TOKEN:-}"
          require_credential 'repo secret' 'MINISIGN_SECRET_KEY' "${MINISIGN_SECRET_KEY:-}"
          require_credential 'repo secret' 'MINISIGN_PASSWORD' "${MINISIGN_PASSWORD:-}"
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo secret' 'MODDE_APT_REPO_GPG_KEY' "${MODDE_APT_REPO_GPG_KEY:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo variable' 'MODDE_APT_REPO_GPG_KEY_ID' "${MODDE_APT_REPO_GPG_KEY_ID:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo variable' 'MODDE_APT_REPO_GPG_FINGERPRINT' "${MODDE_APT_REPO_GPG_FINGERPRINT:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo variable' 'MODDE_APT_REPO_GPG_PUBLIC_KEY' "${MODDE_APT_REPO_GPG_PUBLIC_KEY:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'repo secret' 'MODDE_APT_REPO_SSH_KEY' "${MODDE_APT_REPO_SSH_KEY:-}"
          fi
          if [ "${IS_PRERELEASE}" != "true" ]; then
            require_credential 'global/user secret' 'CODEBERG_TOKEN' "${CODEBERG_TOKEN:-}"
          fi
          if [ -n "$missing" ]; then
            printf 'Missing release credentials:%s\n' "$missing" >&2
            exit 1
          fi
          test -s keys/minisign.pub
          umask 077
          minisign_key="$(mktemp)"; minisign_probe="$(mktemp)"; minisign_sig="${minisign_probe}.minisig"
          trap 'rm -f "$minisign_key" "$minisign_probe" "$minisign_sig"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf 'simit release credentials probe\n' > "$minisign_probe"
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix shell nixpkgs#minisign -c minisign -S -s "$minisign_key" -m "$minisign_probe" -x "$minisign_sig"
          nix shell nixpkgs#minisign -c minisign -V -m "$minisign_probe" -x "$minisign_sig" -p keys/minisign.pub
      - name: Rewrite dist/rpm/modde.spec Version
        run: |
          . ./release-env
          sed -i "0,/^Version:.*$/s//Version:        ${VERSION}/" dist/rpm/modde.spec
          grep '^Version:' dist/rpm/modde.spec
      - name: Check supply-chain policy
        run: |
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#cargo-deny -c cargo deny check -W unmaintained advisories bans sources licenses
      - name: Build SRPM for COPR
        run: |
          set -euo pipefail
          . ./release-env
          git archive --format=tar.gz --prefix=modde-rs/ -o "modde-rs-v${VERSION}.tar.gz" HEAD
          nix shell nixpkgs#rpm nixpkgs#cargo nixpkgs#rustc -c bash <<'SCRIPT'
          set -euo pipefail
          tar xf modde-rs-*.tar.gz
          ( cd modde-rs && cargo vendor vendor > ../cargo-vendor-config.toml )
          tar czf vendor.tar.gz -C modde-rs vendor
          rm -rf target/modde-release/root-artifacts/srpms && mkdir -p target/modde-release/root-artifacts/srpms
          rpmbuild -bs dist/rpm/modde.spec --define "_sourcedir $(pwd)" --define "_srcrpmdir $(pwd)/target/modde-release/root-artifacts/srpms"
          set -- target/modde-release/root-artifacts/srpms/*.src.rpm; test "$#" -eq 1; ls -l "$1"
          SCRIPT
      - name: Generate supply-chain reports
        run: |
          set -euo pipefail
          . ./release-env
          export VERSION IS_PRERELEASE
          mkdir -p release
          nix develop -c bash <<'SBOM'
          set -euo pipefail
          mkdir -p target/modde-release/root-artifacts/release
          cargo about generate --config dist/licenses/about.toml --output-file target/modde-release/root-artifacts/release/THIRD_PARTY_LICENSES.html dist/licenses/about-template.hbs
          cargo sbom --output-format cyclone_dx_json_1_5 > "target/modde-release/root-artifacts/release/modde-${VERSION}.cdx.json"
          cargo sbom --output-format spdx_json_2_3 > "target/modde-release/root-artifacts/release/modde-${VERSION}.spdx.json"
          SBOM

      - name: Build release artifacts
        run: |
          set -euo pipefail
          . ./release-env
          export VERSION IS_PRERELEASE
          mkdir -p release
          copy_nix_binary() {
            result_dir="$1"; binary="$2"; destination="$3"
            if [ -f "${result_dir}/bin/.${binary}-wrapped" ]; then cp "${result_dir}/bin/.${binary}-wrapped" "$destination"; else cp "${result_dir}/bin/${binary}" "$destination"; fi
          }

          nix build .#modde --out-link target/modde-release/root-artifacts/linux-result
          mkdir -p target/modde-release/root-artifacts/release/linux-x86_64
          copy_nix_binary target/modde-release/root-artifacts/linux-result modde target/modde-release/root-artifacts/release/linux-x86_64/modde
          copy_nix_binary target/modde-release/root-artifacts/linux-result modde-ui target/modde-release/root-artifacts/release/linux-x86_64/modde-ui
          tar czf "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64-linux.tar.gz" -C target/modde-release/root-artifacts/release/linux-x86_64 modde modde-ui
          cp target/modde-release/root-artifacts/release/linux-x86_64/modde "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64-linux"
          cp target/modde-release/root-artifacts/release/linux-x86_64/modde-ui "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-x86_64-linux"

          nix build .#modde-aarch64-linux --out-link target/modde-release/root-artifacts/aarch64-linux-result
          mkdir -p target/modde-release/root-artifacts/release/linux-aarch64
          copy_nix_binary target/modde-release/root-artifacts/aarch64-linux-result modde target/modde-release/root-artifacts/release/linux-aarch64/modde
          copy_nix_binary target/modde-release/root-artifacts/aarch64-linux-result modde-ui target/modde-release/root-artifacts/release/linux-aarch64/modde-ui
          tar czf "target/modde-release/root-artifacts/release/modde-${VERSION}-aarch64-linux.tar.gz" -C target/modde-release/root-artifacts/release/linux-aarch64 modde modde-ui
          cp target/modde-release/root-artifacts/release/linux-aarch64/modde "target/modde-release/root-artifacts/release/modde-${VERSION}-aarch64-linux"
          cp target/modde-release/root-artifacts/release/linux-aarch64/modde-ui "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-aarch64-linux"

          nix build .#modde-windows --out-link target/modde-release/root-artifacts/windows-result
          mkdir -p target/modde-release/root-artifacts/release/windows-x86_64
          cp target/modde-release/root-artifacts/windows-result/bin/modde.exe target/modde-release/root-artifacts/windows-result/bin/modde-ui.exe target/modde-release/root-artifacts/release/windows-x86_64/
          if [ -f target/modde-release/root-artifacts/windows-result/bin/libmcfgthread-2.dll ]; then cp target/modde-release/root-artifacts/windows-result/bin/libmcfgthread-2.dll target/modde-release/root-artifacts/release/windows-x86_64/; fi
          # Windows tar.gz/zip and individual signed .exe assets are produced
          # by the Authenticode signing step, after the .exe files are signed.

          nix build .#modde-darwin-aarch64 --out-link target/modde-release/root-artifacts/darwin-arm-result
          mkdir -p target/modde-release/root-artifacts/release/darwin-aarch64
          cp target/modde-release/root-artifacts/darwin-arm-result/bin/modde target/modde-release/root-artifacts/darwin-arm-result/bin/modde-ui target/modde-release/root-artifacts/release/darwin-aarch64/
          tar czf "target/modde-release/root-artifacts/release/modde-${VERSION}-aarch64-darwin.tar.gz" -C target/modde-release/root-artifacts/release/darwin-aarch64 modde modde-ui

          nix build .#appimage-ui --out-link target/modde-release/root-artifacts/appimage-ui-result
          cp target/modde-release/root-artifacts/appimage-ui-result "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-x86_64.AppImage"
          nix build .#appimage-cli --out-link target/modde-release/root-artifacts/appimage-cli-result
          cp target/modde-release/root-artifacts/appimage-cli-result "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64.AppImage"

          git archive --format=tar.gz --prefix=modde-rs/ -o "target/modde-release/root-artifacts/release/modde-rs-${VERSION}.tar.gz" HEAD
          source_sha256="$(sha256sum "target/modde-release/root-artifacts/release/modde-rs-${VERSION}.tar.gz" | awk '{print $1}')"
          nix build .#flatpak-manifest --out-link target/modde-release/root-artifacts/flatpak-result
          cp target/modde-release/root-artifacts/flatpak-result target/modde-release/root-artifacts/release/com.tartanoglu.modde.json
          sed -i "s/@SOURCE_TARBALL_SHA256@/${source_sha256}/" target/modde-release/root-artifacts/release/com.tartanoglu.modde.json
          nix run .#flatpak-cargo-generator -- Cargo.lock -o target/modde-release/root-artifacts/release/cargo-sources.json
          cp target/modde-release/root-artifacts/srpms/*.src.rpm target/modde-release/root-artifacts/release/ 2>/dev/null || true

          rm -rf release
          cp -a target/modde-release/root-artifacts/release ./release
      - name: Build Debian packages
        run: |
          set -euo pipefail
          . ./release-env
          export VERSION IS_PRERELEASE
          mkdir -p release
          nix develop -c simit dist apt build --version "$VERSION" --release-dir release
      - name: Sign Windows Authenticode artifacts
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
          WINDOWS_SIGNING_SUBJECT: ${{ secrets.WINDOWS_SIGNING_SUBJECT }}
        run: |
          set -euo pipefail
          . ./release-env
          for exe in release/windows-x86_64/modde.exe release/windows-x86_64/modde-ui.exe; do test -s "$exe"; done
          if [ -n "${WINDOWS_SIGNING_PFX:-}" ] && [ -n "${WINDOWS_SIGNING_PASS:-}" ]; then
            nix shell nixpkgs#osslsigncode nixpkgs#openssl -c bash <<'SCRIPT'
          set -euo pipefail
          umask 077
          pfx_file="$(mktemp)"; pass_file="$(mktemp)"
          trap 'rm -f "$pfx_file" "$pass_file"' EXIT
          printf '%s' "$WINDOWS_SIGNING_PFX" | base64 --decode > "$pfx_file"
          printf '%s' "$WINDOWS_SIGNING_PASS" > "$pass_file"
          for exe in release/windows-x86_64/modde.exe release/windows-x86_64/modde-ui.exe; do
            osslsigncode sign -pkcs12 "$pfx_file" -readpass "$pass_file" -h sha256 \
              -n 'modde' -i 'https://modde.tartanoglu.com' -ts 'http://timestamp.digicert.com' \
              -in "$exe" -out "${exe}.signed"
            osslsigncode verify -in "${exe}.signed"
            mv "${exe}.signed" "$exe"
          done
          SCRIPT
          else
            echo '::warning::WINDOWS_SIGNING_PFX/PASS unset; publishing unsigned Windows EXEs.'
          fi
          tar czf "release/modde-${VERSION}-x86_64-windows.tar.gz" -C release/windows-x86_64 modde.exe modde-ui.exe
          zip_out="$PWD/release/modde-${VERSION}-x86_64-windows.zip"
          # Expand positional arguments inside the child shell.
          # shellcheck disable=SC2016
          nix shell nixpkgs#zip -c bash -c 'cd "$1" && zip_out="$2" && shift 2 && zip -q "$zip_out" "$@"' _ release/windows-x86_64 "$zip_out" modde.exe modde-ui.exe
          cp release/windows-x86_64/modde.exe "release/modde-${VERSION}-x86_64-windows.exe"
          cp release/windows-x86_64/modde-ui.exe "release/modde-ui-${VERSION}-x86_64-windows.exe"
      - name: Generate release checksums
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=()
          add_matches() { local pattern="$1" match; while IFS= read -r match; do files+=("$match"); done < <(compgen -G "$pattern" || true); }
          add_matches '*.tar.gz'
          add_matches '*.zip'
          add_matches '*.AppImage'
          add_matches '*.deb'
          add_matches '*.src.rpm'
          add_matches '*.cdx.json'
          add_matches '*.spdx.json'
          : > SHA256SUMS.txt
          count=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            [ "$file" != SHA256SUMS.txt ] || continue
            sha256sum "$file" >> SHA256SUMS.txt
            count=$((count + 1))
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          test "$count" -gt 0
          test -s SHA256SUMS.txt
      - name: Sign checksums and attest release artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          . ./release-env
          test -s keys/minisign.pub
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PASSWORD:-}"
          umask 077
          minisign_key="$(mktemp)"; oidc_token="$(mktemp)"; cosign_key="$(mktemp)"; export oidc_token cosign_key
          trap 'rm -f "$minisign_key" "$oidc_token" "$cosign_key"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix shell nixpkgs#minisign -c minisign -S -s "$minisign_key" -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig
          nix shell nixpkgs#minisign -c minisign -V -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig -p keys/minisign.pub

          nix shell nixpkgs#cosign nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          repo_url="https://github.com/caniko/modde-rs"
          git_sha="$(git rev-parse HEAD)"
          workflow_sha="$(sha256sum .github/workflows/release.yml | awk '{print $1}')"
          flake_lock_sha="missing"; if [ -f flake.lock ]; then flake_lock_sha="$(sha256sum flake.lock | awk '{print $1}')"; fi
          builder_id="${repo_url}/blob/${VERSION}/.github/workflows/release.yml"
          sign_blob_keyless() { file="$1"; if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -er '.value' > "$oidc_token"; cosign sign-blob --yes --identity-token "$(cat "$oidc_token")" --bundle "${file}.cosign.bundle" "$file"; else return 1; fi; }
          attest_blob_keyless() { file="$1"; predicate="$2"; if [ -s "$oidc_token" ]; then cosign attest-blob --yes --identity-token "$(cat "$oidc_token")" --predicate "$predicate" --type slsaprovenance1 --bundle "${file}.intoto.bundle" "$file"; else return 1; fi; }
          sign_blob_with_key() { file="$1"; test -n "${COSIGN_PRIVATE_KEY:-}"; printf '%s' "$COSIGN_PRIVATE_KEY" > "$cosign_key"; cosign sign-blob --yes --key "$cosign_key" --bundle "${file}.cosign.bundle" "$file"; }
          attest_blob_with_key() { file="$1"; predicate="$2"; cosign attest-blob --yes --key "$cosign_key" --predicate "$predicate" --type slsaprovenance1 --bundle "${file}.intoto.bundle" "$file"; }
          shopt -s nullglob
          files=(release/*.tar.gz release/*.zip release/*.AppImage release/*.deb release/*.src.rpm release/*.exe)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            artifact_sha="$(sha256sum "$file" | awk '{print $1}')"; predicate="$(mktemp)"
            jq -n --arg builder_id "$builder_id" --arg git_sha "$git_sha" --arg workflow_sha "$workflow_sha" --arg flake_lock_sha "$flake_lock_sha" --arg repo_url "$repo_url" --arg ref "refs/tags/${VERSION}" --arg artifact "$(basename "$file")" --arg artifact_sha "$artifact_sha" '{buildDefinition:{buildType:"https://simit.rs/release",externalParameters:{repository:$repo_url,ref:$ref,artifact:$artifact,artifactDigest:{sha256:$artifact_sha}},internalParameters:{},resolvedDependencies:[{uri:($repo_url+".git"),digest:{gitCommit:$git_sha}},{uri:"flake.lock",digest:{sha256:$flake_lock_sha}},{uri:"release workflow",digest:{sha256:$workflow_sha}}]},runDetails:{builder:{id:$builder_id}}}' > "$predicate"
            if sign_blob_keyless "$file" && attest_blob_keyless "$file" "$predicate"; then echo "signed+attested $file (keyless)"; elif [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then echo "keyless failed for $file; using COSIGN_PRIVATE_KEY"; sign_blob_with_key "$file"; attest_blob_with_key "$file" "$predicate"; else echo "::error::keyless Sigstore failed and COSIGN_PRIVATE_KEY is unset for $file" >&2; exit 1; fi
            test -s "${file}.cosign.bundle"
            test -s "${file}.intoto.bundle"
            rm -f "$predicate"
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          SCRIPT
      - name: Run release smoke checks
        run: |
          set -euo pipefail
          . ./release-env
          mkdir -p release
          nix run .#release-smoke -- "$VERSION" release
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API: https://api.github.com
          GITHUB_REPO: caniko/modde-rs
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          . ./release-env
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$" { found = 1; print; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md || { echo "CHANGELOG.md missing section for $VERSION" >&2; exit 1; }
          release_payload=$(jq -n --arg tag "$VERSION" --arg name "$VERSION" --arg branch "trunk" --argjson prerelease "$IS_PRERELEASE" --rawfile body release-notes.md '{tag_name: $tag, target_commitish: $branch, name: $name, body: $body, draft: false, prerelease: $prerelease}')
          status=$(curl -sS -o release.json -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -d "$release_payload" "$GITHUB_API/repos/$GITHUB_REPO/releases")
          if [ "$status" = "409" ] || [ "$status" = "422" ]; then
            curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/tags/$VERSION" > release.json
          elif [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat release.json; exit 1; fi
          release_id=$(jq -r '.id' release.json); test "$release_id" != "null"
          upload_url=$(jq -r '.upload_url' release.json | cut -d '{' -f 1); test -n "$upload_url"
          shopt -s nullglob
          files=()
          add_matches() { local pattern="$1" match; while IFS= read -r match; do files+=("$match"); done < <(compgen -G "$pattern" || true); }
          add_matches 'release/SHA256SUMS.txt'
          add_matches 'release/SHA256SUMS.txt.minisig'
          add_matches 'release/*.cosign.bundle'
          add_matches 'release/*.intoto.bundle'
          add_matches 'release/*.tar.gz'
          add_matches 'release/*.zip'
          add_matches 'release/*.AppImage'
          add_matches 'release/*.deb'
          add_matches 'release/*.src.rpm'
          add_matches 'release/*.cdx.json'
          add_matches 'release/*.spdx.json'
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            asset_id=$(curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/$release_id/assets" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -n 1)
            if [ -n "$asset_id" ]; then curl -sS --fail -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/assets/$asset_id"; fi
            curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/octet-stream' --data-binary "@$file" "$upload_url?name=$name" > /dev/null
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          SCRIPT
      - name: Push Nix closures to Attic
        run: |
          set -euo pipefail
          attic_token_dir="${ATTIC_TOKENS_DIR:-}"
          attic_token="${attic_token_dir}/modde-rs"
          if [ -z "$attic_token_dir" ] || [ ! -r "$attic_token" ]; then
            echo "::error::Attic token ${ATTIC_TOKENS_DIR:-<unset>}/modde-rs is required because Nix closure cache publishing is configured." >&2
            exit 1
          fi
          nix path-info -r \
            ./target/modde-release/root-artifacts/linux-result \
            ./target/modde-release/root-artifacts/aarch64-linux-result \
            ./target/modde-release/root-artifacts/windows-result \
            ./target/modde-release/root-artifacts/darwin-arm-result \
            ./target/modde-release/root-artifacts/appimage-ui-result \
            ./target/modde-release/root-artifacts/appimage-cli-result \
            ./target/modde-release/root-artifacts/flatpak-result \
            > attic-paths.txt
          attic_config_root="$(mktemp -d)"
          trap 'rm -rf "$attic_config_root"' EXIT
          install -d -m 0700 "$attic_config_root/attic"
          attic_config="$attic_config_root/attic/config.toml"
          install -m 0600 /dev/null "$attic_config"
          { printf '%s\n' 'default-server = "canix"'; printf '%s\n' '[servers.canix]'; printf '%s\n' 'endpoint = "https://attic.candee.baby"'; printf 'token = "%s"\n' "$(cat "$attic_token")"; } > "$attic_config"
          test "$(stat -c '%a' "$attic_config")" = 600
          attic="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#attic-client)"
          test -x "$attic/bin/attic"
          if ! XDG_CONFIG_HOME="$attic_config_root" "$attic/bin/attic" push --stdin --no-closure --ignore-upstream-cache-filter canix < attic-paths.txt; then
            echo "::error::Attic push failed for configured Nix closure cache publishing." >&2
            exit 1
          fi
      - name: Probe downstream publisher state
        run: |
          set -euo pipefail
          . ./release-env
          : > release-publisher-state.env
          write_state() {
            channel="$1"; state="$2"; detail="$3"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            printf '%s=%s\n' "$var" "$state" >> release-publisher-state.env
            printf '%-10s %s %s\n' "$channel" "$state" "$detail"
          }
          public_git_url() {
            case "$1" in
              ssh://git@codeberg.org/*) path="${1#ssh://git@codeberg.org/}"; printf 'https://codeberg.org/%s\n' "$path" ;;
              git@codeberg.org:*) path="${1#git@codeberg.org:}"; printf 'https://codeberg.org/%s\n' "$path" ;;
              ssh://git@codefloe.com/*) path="${1#ssh://git@codefloe.com/}"; printf 'https://codefloe.com/%s\n' "$path" ;;
              git@codefloe.com:*) path="${1#git@codefloe.com:}"; printf 'https://codefloe.com/%s\n' "$path" ;;
              ssh://git@github.com/*) path="${1#ssh://git@github.com/}"; printf 'https://github.com/%s\n' "$path" ;;
              git@github.com:*) path="${1#git@github.com:}"; printf 'https://github.com/%s\n' "$path" ;;
              *) printf '%s\n' "$1" ;;
            esac
          }
          probe_git_file() {
            repo="$1"; ref="$2"; path="$3"
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            git clone --depth 1 --branch "$ref" "$(public_git_url "$repo")" "$tmp/repo" >/dev/null 2>&1 && test -e "$tmp/repo/$path"
          }
          probe_git_tree() {
            repo="$1"; ref="$2"; path_a="$3"; path_b="$4"; tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            git clone --depth 1 --branch "$ref" "$(public_git_url "$repo")" "$tmp/repo" >/dev/null 2>&1 && test -e "$tmp/repo/$path_a" && test -e "$tmp/repo/$path_b"
          }
          active_or_soft() {
            channel="$1"; detail="$2"; shift 2
            if "$@"; then write_state "$channel" active-required "$detail"; else write_state "$channel" inactive-soft "$detail"; fi
          }
          stable_or_state() {
            channel="$1"; detail="$2"; shift 2
            if [ "$IS_PRERELEASE" = "true" ]; then write_state "$channel" skipped-prerelease "$detail"; else active_or_soft "$channel" "$detail" "$@"; fi
          }
          stable_or_state apt 'ssh://git@github.com/caniko/apt-modde.git pages' probe_git_tree 'ssh://git@github.com/caniko/apt-modde.git' 'pages' dists pool
          stable_or_state aur 'modde' bash -c 'git ls-remote --exit-code '\''https://aur.archlinux.org/modde.git'\'' HEAD >/dev/null 2>&1 && git ls-remote --exit-code '\''https://aur.archlinux.org/modde-bin.git'\'' HEAD >/dev/null 2>&1 && git ls-remote --exit-code '\''https://aur.archlinux.org/modde-git.git'\'' HEAD >/dev/null 2>&1'
          COPR_PROBE_PROJECT='caniko/modde-rs'
          if [ "$IS_PRERELEASE" = "true" ]; then COPR_PROBE_PROJECT='caniko/modde-rs-testing'; fi
          active_or_soft copr "$COPR_PROBE_PROJECT" curl -fsSL "https://copr.fedorainfracloud.org/coprs/${COPR_PROBE_PROJECT}/"
          CHOCO_FILTER="$(printf '%s' 'Id eq '\''modde'\'' and IsLatestVersion' | jq -sRr @uri)"
          export CHOCO_FILTER
          # Expand the filter in the child shell.
          # shellcheck disable=SC2016
          stable_or_state chocolatey 'modde' bash -c 'curl -fsSL "https://community.chocolatey.org/api/v2/Packages()?%24filter=${CHOCO_FILTER}" | grep -q "<entry>"'
          stable_or_state homebrew 'https://codeberg.org/caniko/homebrew-modde.git' probe_git_file 'https://codeberg.org/caniko/homebrew-modde.git' HEAD 'Formula/modde.rb'
          stable_or_state scoop 'https://github.com/caniko/scoop-modde.git' probe_git_file 'https://github.com/caniko/scoop-modde.git' HEAD 'bucket/modde.json'
          stable_or_state flathub 'flathub/com.tartanoglu.modde' curl -fsSL 'https://api.github.com/repos/flathub/com.tartanoglu.modde'
          stable_or_state winget 'Caniko.Modde' curl -fsSL 'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/c/Caniko/Modde'
      - name: Publish APT repository
        env:
          APT_REPO_GPG_KEY: ${{ secrets.MODDE_APT_REPO_GPG_KEY }}
          APT_REPO_GPG_KEY_ID: ${{ vars.MODDE_APT_REPO_GPG_KEY_ID }}
          APT_REPO_GPG_PASSPHRASE: ${{ secrets.MODDE_APT_REPO_GPG_PASSPHRASE }}
