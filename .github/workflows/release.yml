          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate tag
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_TAG"
          TAG="$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          git_fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_worktree="$(mktemp -d)"
          rmdir "$tag_worktree"
          cleanup_validation() {
            if [ -n "${tag_worktree:-}" ]; then git worktree remove --force "$tag_worktree" >/dev/null 2>&1 || rm -rf "$tag_worktree"; fi
            if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup_validation EXIT
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"
          git verify-tag "$TAG"
          signed_tag_name="$(git cat-file tag "refs/tags/$TAG" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$TAG" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          test "$validated_sha" = "$checkout_sha" || { echo "Signed tag commit does not match the checked-out tag" >&2; exit 1; }
          printf 'sha=%s\n' "$validated_sha" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$tag_worktree" "$validated_sha"
          test "$(nix eval --raw "$tag_worktree#modde.version")" = "$VERSION"
          if ! grep -q "^## \[$VERSION\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]" "$tag_worktree/CHANGELOG.md"; then
            echo "CHANGELOG.md missing section for $VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s\n' "$VERSION" | grep -Eq -- '-(rc|beta|alpha)\.[0-9]+$'; then IS_PRERELEASE=true; fi

          git checkout --detach "$validated_sha"
          { printf 'TAG=%s\n' "$TAG"; printf 'VERSION=%s\n' "$VERSION"; printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"; } > release-env
      - name: Download and verify release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API: https://api.github.com
          GITHUB_REPO: caniko/modde-rs
          REPUBLISH_CHANNELS: ${{ steps.republish.outputs.channels }}
        run: |
          set -euo pipefail
          nix shell nixpkgs#curl nixpkgs#jq nixpkgs#minisign -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          mkdir -p release
          curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API/repos/$GITHUB_REPO/releases/tags/$TAG" > release.json
          fetch() {
            id="$(jq -r --arg n "$1" '[.assets[] | select(.name == $n)][0].id // empty' release.json)"
            [ -n "$id" ] || { echo "::error::release $TAG has no asset $1" >&2; exit 1; }
            curl -sS --fail -L -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/octet-stream' -o "release/$1" "$GITHUB_API/repos/$GITHUB_REPO/releases/assets/$id"
          }
          fetch SHA256SUMS.txt
          fetch SHA256SUMS.txt.minisig
          test -s keys/minisign.pub
          minisign -V -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig -p keys/minisign.pub
          need=()
          case ",$REPUBLISH_CHANNELS," in *,flathub,*) need+=("com.tartanoglu.modde.json"); need+=("cargo-sources.json"); ;; esac
          case ",$REPUBLISH_CHANNELS," in *,winget,*) need+=("modde-${VERSION}-x86_64-windows.zip"); ;; esac
          case ",$REPUBLISH_CHANNELS," in *,homebrew,*) need+=("modde-${VERSION}-aarch64-darwin.tar.gz"); need+=("modde-${VERSION}-aarch64-linux.tar.gz"); need+=("modde-${VERSION}-x86_64-linux.tar.gz"); ;; esac
          case ",$REPUBLISH_CHANNELS," in *,scoop,*) need+=("modde-${VERSION}-x86_64-windows.zip"); ;; esac
          case ",$REPUBLISH_CHANNELS," in *,chocolatey,*) need+=("modde-${VERSION}-x86_64-windows.zip"); ;; esac
          mapfile -t listed < <(awk '{print $2}' release/SHA256SUMS.txt)
          : > release-selected.sums
          for pattern in "${need[@]}"; do
            found=0
            for name in "${listed[@]}"; do
