          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${CHOCOLATEY_API_KEY:-}" ]; then publisher_missing chocolatey 'CHOCOLATEY_API_KEY unset'; fi
          ZIP="release/modde-${VERSION}-x86_64-windows.zip"; test -s "$ZIP" || publisher_missing chocolatey "missing $ZIP"
          if [ "${CHOCO_CANDIDATE_CACHE_HIT:-}" != true ]; then echo 'Chocolatey candidate persistence was not verified.' >&2; exit 1; fi
          nix develop -c nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'modde' \
            --choco-id 'modde' \
            --choco-title 'modde' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Cross-platform game mod manager' \
            --choco-project-url 'https://modde.tartanoglu.com' \
            --choco-license-url 'https://raw.githubusercontent.com/caniko/modde-rs/trunk/LICENSE' \
            --choco-download-repo 'caniko/modde-rs' \
            --choco-archive-pattern 'modde-{version}-{arch}-windows.zip' \
            --push \
            --push-source "$CHOCO_PUSH_SOURCE" \
            --api-key-env CHOCOLATEY_API_KEY
  republish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Select channels to republish
        id: republish
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNELS: ${{ inputs.channels }}
        run: |
          set -euo pipefail
          known=' aur flathub winget homebrew scoop chocolatey '
          version="$INPUT_TAG"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$' || { echo "::error::tag '$INPUT_TAG' is not a release tag" >&2; exit 1; }
          selected=','
          IFS=',' read -ra requested <<< "$INPUT_CHANNELS"
          for raw in "${requested[@]}"; do
            channel="$(printf '%s' "$raw" | tr -d '[:space:]')"
            [ -n "$channel" ] || continue
            case "$known" in *" $channel "*) ;; *) echo "::error::channel '$channel' is unknown, not configured here or not republishable; choose from:$known" >&2; exit 1;; esac
