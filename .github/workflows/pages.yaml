# Generated by simit. Manual edits will be reported as ci=drift.
name: pages

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # impure-env carries SCCACHE_DIR into the sandbox. /build is the
      # sandbox's writable scratch dir; sccache uses it as a throwaway
      # local cache. Public runners have no managed cache transport, and
      # without a writable SCCACHE_DIR the harbor-rs wrapper refuses the
      # build. Converge into simit config once the pages renderer
      # supports extra_env.
      NIX_CONFIG: |
        experimental-features = nix-command flakes configurable-impure-env
        impure-env = [ "SCCACHE_DIR" ]
      SCCACHE_DIR: "/build"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # Daemon-side config: NIX_CONFIG env never reaches nix-daemon,
          # so impure-env must be installed here to carry SCCACHE_DIR
          # into sandboxed builders.
          extra_nix_config: |
            experimental-features = nix-command flakes configurable-impure-env
            impure-env = [ "SCCACHE_DIR" ]

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Probe builder environment
        # TEMPORARY diagnostic; remove once green.
        run: |
          nix build --impure --no-link --print-out-paths --expr 'derivation { name = "sccache-probe"; system = builtins.currentSystem; builder = "/bin/sh"; args = [ "-c" "printf ''SCCACHE_DIR=<%s>\\n'' \"$SCCACHE_DIR\"; for d in /build \"$SCCACHE_DIR\"; do if test -d \"$d\"; then echo \"DIR-OK $d\"; else echo \"DIR-MISSING $d\"; fi; if test -w \"$d\"; then echo \"W-OK $d\"; else echo \"W-NO $d\"; fi; done; : > $out" ]; }' || true
      - name: Build Pages site
        run: |
          nix build .#site --out-link result-pages-site
          test -f result-pages-site/.domains
          grep -qx modde.tartanoglu.com result-pages-site/.domains
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: result-pages-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
