[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "transitive paste usage has no fixed upstream release available" },
  { id = "RUSTSEC-2026-0194", reason = "remaining path is latest wayland-scanner build-time XML code generation; runtime FOMOD XML parsing is upgraded through patched fomod-oxide" },
  { id = "RUSTSEC-2026-0195", reason = "remaining path is latest wayland-scanner build-time XML code generation; runtime FOMOD XML parsing is upgraded through patched fomod-oxide" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "GPL-3.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/caniko/rs-fomod-oxide.git",
  "https://github.com/caniko/harbor-rs.git",
  "https://github.com/caniko/rs-memory-admission.git",
]
