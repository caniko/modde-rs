[package]
name = "modde"
version.workspace = true
description = "CLI interface for modde"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/modde"
include = [
  "../../LICENSE",
  "../../README.md",
  "CHANGELOG.md",
  "Cargo.toml",
  "src/**",
  "tests/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[test]]
name = "cli_patcher_exec"
required-features = ["bethesda"]

[package.metadata.release]
pre-release-replacements = [
  { file = "../../dist/rpm/modde.spec", search = "^Version:\\s+.*$", replace = "Version:        {{version}}", exactly = 1 },
]

[package.metadata.deb]
name = "modde"
maintainer = "Can H. Tartanoglu <caniko@codeberg.org>"
depends = "libc6, libgcc-s1, libssl3, libdbus-1-3, libsqlite3-0, libwayland-client0, libxkbcommon0, libvulkan1"
section = "utils"
priority = "optional"
assets = [
  [
    "../../target/release/modde",
    "usr/bin/",
    "755",
  ],
  [
    "../../target/release/modde-ui",
    "usr/bin/",
    "755",
  ],
  [
    "../../dist/modde-ui.desktop",
    "usr/share/applications/com.tartanoglu.modde.desktop",
    "644",
  ],
  [
    "../../dist/com.tartanoglu.modde.metainfo.xml",
    "usr/share/metainfo/com.tartanoglu.modde.metainfo.xml",
    "644",
  ],
  [
    "../../dist/com.tartanoglu.modde.png",
    "usr/share/icons/hicolor/512x512/apps/com.tartanoglu.modde.png",
    "644",
  ],
  [
    "../../dist/assets/logo/logo.svg",
    "usr/share/icons/hicolor/scalable/apps/com.tartanoglu.modde.svg",
    "644",
  ],
  [
    "../../LICENSE",
    "usr/share/doc/modde/copyright",
    "644",
  ],
  [
    "../../README.md",
    "usr/share/doc/modde/README.md",
    "644",
  ],
]

[features]
default = ["gui", "all-games", "bethesda-archives", "postgres", "rar", "linux-integrations", "macos-integrations"]
all-games = ["bethesda", "gamebryo", "cyberpunk", "ue4", "bg3", "stardew", "bannerlord", "witcher3", "oblivion-remastered"]
bethesda = ["modde-games/bethesda", "modde-sources/bethesda", "modde-ui?/bethesda"]
gamebryo = ["modde-games/gamebryo", "modde-sources/gamebryo", "modde-ui?/gamebryo"]
cyberpunk = ["modde-games/cyberpunk", "modde-sources/cyberpunk", "modde-ui?/cyberpunk"]
ue4 = ["modde-games/ue4", "modde-sources/ue4", "modde-ui?/ue4"]
bg3 = ["modde-games/bg3", "modde-sources/bg3", "modde-ui?/bg3"]
stardew = ["modde-games/stardew", "modde-sources/stardew", "modde-ui?/stardew"]
bannerlord = ["modde-games/bannerlord", "modde-sources/bannerlord", "modde-ui?/bannerlord"]
witcher3 = ["modde-games/witcher3", "modde-sources/witcher3", "modde-ui?/witcher3"]
oblivion-remastered = ["modde-games/oblivion-remastered", "modde-sources/oblivion-remastered", "modde-ui?/oblivion-remastered"]
bethesda-archives = ["modde-sources/bethesda-archives", "modde-ui?/bethesda-archives"]
postgres = ["modde-core/postgres", "modde-ui?/postgres"]
gui = ["dep:modde-ui"]
rar = ["modde-sources/rar"]
linux-integrations = [
  "modde-core/linux-integrations",
  "modde-games/linux-integrations",
  "modde-sources/linux-integrations",
  "modde-ui?/linux-integrations",
]
macos-integrations = [
  "modde-core/macos-integrations",
  "modde-games/macos-integrations",
  "modde-sources/macos-integrations",
  "modde-ui?/macos-integrations",
]
windows-integrations = [
  "modde-core/windows-integrations",
  "modde-games/windows-integrations",
  "modde-sources/windows-integrations",
  "modde-ui?/windows-integrations",
]
heap-profile = []
# Hidden `modde dev screenshot` command for headless GUI asset capture.
# Non-default; enables the modde-ui headless screenshot backend.
screenshot = ["gui", "modde-ui/screenshot"]
remote-telemetry = [
  "dep:detritus",
  "dep:detritus-protocol",
  "dep:dirs",
  "dep:modde-oracle-api",
  "dep:secrecy",
  "dep:sha2",
  "dep:uuid",
]

[[bin]]
name = "modde"
path = "src/main.rs"

[dependencies]
modde-core = { workspace = true }
modde-sources = { workspace = true }
modde-games = { workspace = true }
modde-ui = { workspace = true, optional = true }
modde-oracle-api = { workspace = true, optional = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
detritus = { workspace = true, optional = true }
detritus-protocol = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
xxhash-rust = { workspace = true }
fomod-oxide = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
zip = { workspace = true }
url = { workspace = true }
notify = { workspace = true }
open = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
