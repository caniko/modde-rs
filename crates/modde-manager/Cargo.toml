[package]
name = "modde-manager"
version.workspace = true
description = "Declarative post-Home-Manager reconciler for modde game clients"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["wow"]
wow = ["dep:anyhow", "dep:clap", "dep:libc", "dep:nix-manager-core", "dep:serde", "dep:serde_json", "dep:serde_yaml_ng", "dep:sha2", "dep:tempfile"]

[[bin]]
name = "modde-manager"
path = "src/main.rs"
required-features = ["wow"]

[[test]]
name = "config_fallback"
required-features = ["wow"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
nix-manager-core = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml_ng = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
