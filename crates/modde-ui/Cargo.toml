[package]
name = "modde-ui"
version.workspace = true
description = "GUI application for modde"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/modde-ui"
include = [
  "../../LICENSE",
  "../../README.md",
  "../../dist/com.tartanoglu.modde.png",
  "CHANGELOG.md",
  "Cargo.toml",
  "src/**",
  "tests/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = [
  "all-games",
  "bethesda-archives",
  "postgres",
  "linux-integrations",
  "macos-integrations",
]
all-games = [
  "bethesda",
  "gamebryo",
  "cyberpunk",
  "ue4",
  "bg3",
  "stardew",
  "bannerlord",
  "witcher3",
  "oblivion-remastered",
]
bethesda = ["modde-games/bethesda", "modde-sources/bethesda"]
gamebryo = ["modde-games/gamebryo", "modde-sources/gamebryo"]
cyberpunk = ["modde-games/cyberpunk", "modde-sources/cyberpunk"]
ue4 = ["modde-games/ue4", "modde-sources/ue4"]
bg3 = ["modde-games/bg3", "modde-sources/bg3"]
stardew = ["modde-games/stardew", "modde-sources/stardew"]
bannerlord = ["modde-games/bannerlord", "modde-sources/bannerlord"]
witcher3 = ["modde-games/witcher3", "modde-sources/witcher3"]
oblivion-remastered = [
  "modde-games/oblivion-remastered",
  "modde-sources/oblivion-remastered",
]
bethesda-archives = ["modde-sources/bethesda-archives"]
postgres = ["modde-core/postgres"]
# Headless offscreen screenshot CLI support. Non-default so release binaries
# carry zero extra weight. Pulls iced_test (the dual-backend tiny-skia renderer)
# in as a normal dependency only when enabled.
screenshot = ["dep:iced_test"]
linux-integrations = [
  "modde-core/linux-integrations",
  "modde-games/linux-integrations",
]
macos-integrations = [
  "modde-core/macos-integrations",
  "modde-games/macos-integrations",
]
windows-integrations = [
  "modde-core/windows-integrations",
  "modde-games/windows-integrations",
]

[dependencies]
modde-core = { workspace = true }
modde-sources = { workspace = true }
modde-games = { workspace = true }
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
iced_test = { version = "0.14", optional = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rfd = { workspace = true }
zip = { workspace = true }
tracing = { workspace = true }
smallvec = { workspace = true }
tracing-subscriber = { workspace = true }
fomod-oxide = { workspace = true }
image = { workspace = true }
open = { workspace = true }
unicode-segmentation = "1.12"

[dev-dependencies]
iced_test = "0.14"
tempfile = { workspace = true }
