[package]
name = "modde-core"
version.workspace = true
description = "Core types and logic for the modde mod manager"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/modde-core"
include = [
  "../../LICENSE",
  "../../README.md",
  "CHANGELOG.md",
  "Cargo.toml",
  "benches/**",
  "src/**",
  "tests/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["postgres", "bethesda-archives"]
bethesda-archives = ["dep:flate2", "dep:lz4_flex"]
# Enable the PostgreSQL backend in addition to the always-present SQLite backend.
postgres = ["sqlx/postgres"]
linux-integrations = []
macos-integrations = []
windows-integrations = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
smallvec = { workspace = true }
xxhash-rust = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
flate2 = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
git2 = { workspace = true }
dirs = { workspace = true }
zip = { workspace = true }
fomod-oxide = { workspace = true }
reflink-copy = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
criterion = { workspace = true }
proptest = { workspace = true }
serial_test = { workspace = true }
wiremock = { workspace = true }

[[bench]]
name = "vfs_deploy"
harness = false
