# Canonical capability baseline for modde.
#
# This file is the single source of truth for game and feature status claims.
# It is consumed by:
#   - crates/modde-core/tests/repo_truth_tests.rs (guardrail: README, the docs
#     site, the website comparison, and the parity reference must agree with it)
#   - website/plinth-project.toml (capability_matrix section reads this file)
#   - docs/src/games/supported-games.md (human-readable table)
#   - docs/src/reference/parity.md (MO2 parity audit)
#
# Status vocabulary is defined in [status] below. Do not market anything above
# its real status here.

[status]
done = "Shipped end to end and user-reachable."
partial = "Core logic exists, but the UX, integration, or production safety is still incomplete."
not_shipped = "Must not be marketed as available yet."

