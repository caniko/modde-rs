[workspace]
resolver = "2"
members = [
  "crates/modde-core",
  "crates/modde-sources",
  "crates/modde-games",
  "crates/modde-ui",
  "crates/modde-cli",
  "crates/modde-oracle-api",
  "crates/modde-oracle",
  "crates/modde-xtask",
  "crates/modde-manager",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0"
repository = "https://github.com/caniko/modde-rs"
authors = ["Can H. Tartanoglu"]
keywords = ["modding", "mod-manager", "nexus-mods", "wabbajack", "game-mods"]
categories = ["command-line-utilities", "game-development"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde_yaml_ng = "0.10.0"

# Async
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "io-util",
  "net",
  "time",
] }
futures = "0.3.34"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
detritus = { package = "detritus-client", version = "0.1.0", git = "https://github.com/caniko/rs-detritus.git", rev = "a0f8d257619e599a110f41054a57dae537337043", default-features = false }
detritus-protocol = { version = "0.1.0", git = "https://github.com/caniko/rs-detritus.git", rev = "a0f8d257619e599a110f41054a57dae537337043", default-features = false }
secrecy = "0.10.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# Hashing
xxhash-rust = { version = "0.8.19", features = ["xxh3", "xxh64"] }
sha2 = "0.11.0"

# Small-vec inline optimization
smallvec = { version = "1.16.2", features = ["serde"] }

# HTTP
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "stream",
  "json",
  "form",
  "cookies",
] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tower = { version = "0.5.3", features = ["util"] }
semver = "1.0.28"
resolvo = { version = "0.12.1", features = ["tokio"] }

# Keyring
keyring = "4.2.0"
keyring-core = "1.0.0"

# Crypto
aes = "0.9.3"
ctr = "0.10.1"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"

# Compression
flate2 = "1.1.10"
lz4_flex = "0.14.0"
zip = "8.6.0"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = [
  "util",
  "bzip2",
  "deflate",
  "aes256",
  "ppmd",
  "lz4",
  "zstd",
  "brotli",
] }
reflink-copy = { version = "0.1.30", features = ["tracing"] }
zstd = { version = "0.14.0", default-features = false, features = ["zstdmt"] }

# Byte buffers / caches
bytes = "1.12.1"
lru = "0.18.5"
parking_lot = "0.12.5"
dashmap = "6.2.1"

# Temp files
tempfile = "3.27.0"
pretty_assertions = "1.4.1"

# Snapshot / CLI testing
insta = "1.48.0"
assert_cmd = "2.2.2"
wiremock = "0.6.5"
serial_test = "4.0.1"

# Benchmarks + property-based tests
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"

# OS / system
libc = "0.2.189"
dirs = "7.0.0"
which = "8.0.6"
winreg = "0.56.0"

# Filesystem watch (inotify/kqueue)
notify = { version = "8.2.0", default-features = false, features = [
  "macos_kqueue",
] }

# Database — async, multi-backend (SQLite default + optional Postgres).
# `sqlite` pulls bundled libsqlite3-sys (no system SQLite needed; cross-build clean).
# The `postgres` backend is enabled via the modde-core `postgres` feature.
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
] }

# Git — local repository operations only (snapshot save/restore in
# modde-core). default-features=false drops the `ssh`+`https` transports,
# which otherwise pull libssh2-sys + openssl-sys; on the apple-darwin cross
# target (darwinArgs.buildInputs=[]) openssl-sys has no OpenSSL to link and
# fails. modde makes zero network git calls, so the transports are dead weight.
git2 = { version = "0.21.0", default-features = false }

# Image processing
image = "0.25.10"

# File dialog
rfd = "0.17.2"

# Open files/URLs with default system handler
open = "5.4.4"
url = "2.5.8"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"

# FOMOD
fomod-oxide = { version = "0.1.0", features = ["json"] }

# Workspace crates
modde-core = { version = "0.7.0", path = "crates/modde-core", default-features = false }
modde-sources = { version = "0.7.0", path = "crates/modde-sources", default-features = false }
modde-games = { version = "0.7.0", path = "crates/modde-games", default-features = false }
modde-ui = { version = "0.7.0", path = "crates/modde-ui", default-features = false }
modde-oracle-api = { version = "0.7.0", path = "crates/modde-oracle-api" }
nix-manager-core = { git = "https://github.com/caniko/nix-manager-core.git", branch = "trunk" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
explicit_counter_loop = "allow"
format_push_string = "allow"
default_trait_access = "allow"
if_same_then_else = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
large_enum_variant = "allow"
large_stack_arrays = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_wildcard_for_single_variants = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
redundant_guards = "allow"
result_large_err = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
type_complexity = "allow"
unnecessary_get_then_check = "allow"
unnecessary_sort_by = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
unused_self = "allow"
used_underscore_binding = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
fomod-oxide = { git = "https://github.com/caniko/rs-fomod-oxide.git", rev = "87951e558d8b71e21fabf9f39766690e7b584ba3" }
