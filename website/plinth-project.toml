title = "modde"
tagline = "A cross-platform game mod manager"
subtitle = "Install Wabbajack modlists, Nexus Collections, and individual mods with a clean game directory on Linux, macOS, and Windows."
person = "caniko"

[[pages.sections.ctas]]
label = "Install"
href = "#install"
primary = true

[[pages.sections.ctas]]
label = "Docs"
href = "/docs/"

[[pages.sections]]
type = "feature_grid"

[[pages.sections.features]]
title = "Cross-platform"
description = "First-class on Linux, macOS, and Windows. The CLI and desktop app run natively on every platform."

[[pages.sections.features]]
title = "Wabbajack on any OS"
description = "Parse and install .wabbajack modlists natively without a Windows VM."

[[pages.sections.features]]
title = "Nexus integration"
description = "Browse, search, and download from Nexus Mods; pin Nexus Collections by version."

[[pages.sections.features]]
title = "VFS deployment"
description = "A virtual filesystem keeps your game directory pristine while mods overlay cleanly."

[[pages.sections.features]]
title = "Conflict detection"
description = "Graph-based mod conflict analysis makes file collisions visible before deploy."

[[pages.sections.features]]
title = "Crash-log correlation"
description = "Local Crash Logger SSE and Trainwreck logs can be mapped back to the managed profile, versions, installed files, and load order."

[[pages.sections.features]]
title = "Save vaults"
description = "Git-backed save snapshots with history, restore, and compatibility warnings."

[[pages.sections.features]]
title = "Profile experiments"
description = "Try mod changes non-destructively, then rollback or commit when done."

[[pages.sections.features]]
title = "Declarative with Nix"
description = "Optional Home Manager integration declares reproducible mod profiles as code."

[[pages.sections]]
type = "person_mention"
id = "maintainer"
heading = "Maintainer"
intro = "modde is maintained as an open-source project by Caniko."
person = "caniko"

[[pages.sections]]
type = "install"
id = "install"
heading = "Install"
intro = "Pick the route that matches how you already manage software. Each card shows one default path; the full guide covers verification and alternatives."
guide_href = "/docs/getting-started/installation.html"

[[pages.sections.primary_routes]]
label = "Linux desktop"
audience = "GUI users"
href = "/docs/getting-started/installation.html#flatpak"
command = "flatpak install flathub com.tartanoglu.modde"
recommended = true

[[pages.sections.primary_routes]]
label = "Linux native packages"
audience = "Distro packages"
href = "/docs/getting-started/installation.html#linux"
command = "yay -S modde-bin"

[[pages.sections.primary_routes]]
label = "macOS"
audience = "Homebrew"
href = "/docs/getting-started/installation.html#homebrew"
command = "brew install modde"

[[pages.sections.primary_routes]]
label = "Windows"
audience = "Package manager"
href = "/docs/getting-started/installation.html#winget"
command = "winget install Caniko.Modde"

[[pages.sections.secondary_routes]]
label = "Nix / Home Manager"
audience = "Declarative"
href = "/docs/getting-started/installation.html#nix"
command = "nix run codeberg:caniko/rs-modde"

[[pages.sections.secondary_routes]]
label = "Cargo CLI"
audience = "Rust users"
href = "/docs/getting-started/installation.html#cargo"
command = "cargo install modde"

[[pages.sections.secondary_routes]]
label = "Build from source"
audience = "Developers"
href = "/docs/getting-started/installation.html#build-from-source"
command = "git clone https://github.com/caniko/rs-modde"

