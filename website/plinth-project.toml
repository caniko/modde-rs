[[pages.sections.rows]]
area = "Profiles + save vaults"
status = "Done"
notes = "Profile switching, experiments, git-backed save history, and fingerprints are shipped."

[[pages.sections.rows]]
area = "VFS deployment"
status = "Done"
notes = "Symlink-farm deployment, rollback, and conflict resolution are strong differentiators on Linux."

[[pages.sections.rows]]
area = "Nexus / Wabbajack / Collections"
status = "Done"
notes = "These are the first-class install flows today."

[[pages.sections.rows]]
area = "Data Files / Diagnostics / Tools / Downloads views"
status = "Partial"
notes = "Reachable and data-backed, but not yet MO2-complete."

[[pages.sections.rows]]
area = "BAIN and non-Nexus source breadth"
status = "Partial"
notes = "Core plumbing exists, but UX and positioning are still incomplete."

[[pages.sections.rows]]
area = "Generic / user-defined games"
status = "Partial"
notes = "Arbitrary titles can be registered, without bespoke scanner or save tracker depth."
