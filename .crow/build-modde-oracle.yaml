# Generated by simit. Manual edits will be reported as ci=drift.
name: build
labels:
  agent: codefloe-global
  platform: linux/amd64
when:
- event: push
- event: pull_request
steps:
- name: nix-config
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix --version
  - export NIX_CONFIG="experimental-features = nix-command flakes"
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: nix-check
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c nix flake check
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: project-check
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c cargo run -p modde-xtask -- check
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
